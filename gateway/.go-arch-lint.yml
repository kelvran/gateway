version: 3
workdir: internal

allow:
  depOnAnyVendor: true

excludeFiles:
  - "^.*_test\\.go$"

components:
  credentialstate:   { in: credentialstate }
  identity:          { in: identity }
  identity-boltstore: { in: identity/boltstore }
  identity-redisstore: { in: identity/redisstore }
  budget:            { in: budget }
  budget-boltstore:  { in: budget/boltstore }
  budget-redisbudget: { in: budget/redisbudget }
  ratelimit:         { in: [ratelimit, ratelimit/**] }
  router:            { in: router }
  costaccounting:    { in: costaccounting }
  guardrail:         { in: guardrail }
  bedrockguard:      { in: guardrail/bedrockguard }
  embedsim:          { in: guardrail/embedsim }
  telemetry:         { in: telemetry }
  cache-correlation: { in: telemetry/cachecorrelation }
  spend-velocity:    { in: telemetry/spendvelocity }
  telemetry-exporterkind: { in: telemetry/exporterkind }
  cache:             { in: cache }
  cache-inprocess:   { in: cache/inprocess }
  cache-grpcserver:  { in: cache/grpcserver }
  cache-grpcclient:  { in: cache/grpcclient }
  adapter:           { in: adapter }
  adapter-impl:      { in: adapter/*/** }
  streaming:         { in: streaming }
  # The Anthropic Messages ingress (RFC-1, docs/rfcs/2026-10-09-gateway-
  # anthropic-messages-ingress.md §1): a leaf that depends only on the two
  # canonical schemas; dataplane imports it (slice S9b), cmd/gateway sits
  # outside workdir and needs no entry.
  ingress-anthropicmsgs: { in: ingress/anthropicmsgs }
  controlplane:      { in: gateway/controlplane }
  dataplane:         { in: gateway/dataplane }
  admin:             { in: admin }
  admin-auditstore:  { in: admin/auditstore }
  adminapi:          { in: adminapi }
  prompt:            { in: prompt }
  prompt-boltstore:  { in: prompt/boltstore }
  gatewayevents:     { in: ../api/gatewayevents/v1 }
  backup:            { in: backup }
  idempotency:            { in: idempotency }
  idempotency-inprocess:  { in: idempotency/inprocess }
  configpropagation:      { in: configpropagation }
  alerting:               { in: alerting }
  anomaly:                { in: anomaly }
  bench:                  { in: bench }
  cli:                    { in: cli }
  benchupstream:          { in: benchupstream }

# Components deliberately absent from `deps:` below (credentialstate,
# identity, ratelimit, router, costaccounting, guardrail,
# telemetry-exporterkind, cache-correlation, cache, adapter, controlplane,
# backup, idempotency,
# configpropagation, alerting, budget-redisbudget, anomaly, bench,
# benchupstream) are pure
# leaves per
# gateway/ARCHITECTURE.md's dependency direction rules: a component with
# no entry here may depend on nothing else in this project (verified
# against go-arch-lint's own source -- checker_imports.go denies any
# project-internal import for a component absent from this map; it is
# not "unchecked"). Listing them here anyway with an empty mayDependOn
# would only produce a benign self-inspection notice that skips the real
# check entirely (validator_deps.go), so they are omitted on purpose, not
# forgotten. cache-correlation (telemetry/cachecorrelation, per
# docs/rfcs/2026-09-07-cache-cross-instance-telemetry.md) is a pure leaf
# for the same reason telemetry itself was until 2026-10-10: stdlib-only, no
# project-internal imports, nothing in this project depends on it either
# (it's a standalone analysis unit, not wired into the live pipeline).
# spend-velocity (telemetry/spendvelocity, per docs/upgrade-research/
# llm-cost-optimization-finops-2026-09-14.md Finding 6) is the identical
# shape: stdlib-only CUSUM primitive, nothing in this project depends on
# it yet -- also a standalone analysis unit, not wired into the live
# pipeline this pass.
#
# cache's 3 real implementations (inprocess/grpcserver/grpcclient) are
# each their own component, not lumped into `cache` itself, since
# go-arch-lint never grants implicit same-component self-import rights --
# each is a genuinely separate Go package that imports the base `cache`
# package's interface types, and needs to say so explicitly.
#
# budget-redisbudget (budget/redisbudget), unlike its sibling
# budget-boltstore right above, deliberately does NOT import `budget` at
# all -- it satisfies budget.RedisBackend structurally, the same
# interface-lives-in-the-consumer idiom ratelimit/redislimiter already
# establishes (see redisbudget.go's own package doc comment) -- hence its
# absence from `deps:` below is a real pure-leaf property, not an
# oversight to reconcile with budget-boltstore's real `mayDependOn:
# [budget]` entry.
#
# identity-redisstore (identity/redisstore) is the OPPOSITE shape from
# budget-redisbudget above -- it DOES import `identity` directly, exactly
# like identity-boltstore right below, because identity.Store's own
# interface signature requires the concrete VirtualKey type; there is no
# primitive-only shape to satisfy structurally the way
# budget.RedisBackend/ratelimit.RedisBackend were deliberately designed
# to allow.
deps:
  identity-boltstore:
    mayDependOn:
      - identity
  identity-redisstore:
    mayDependOn:
      - identity
  prompt-boltstore:
    mayDependOn:
      - prompt
  budget-boltstore:
    mayDependOn:
      - budget
  # telemetry's one project-internal import is its own stdlib-only sub-leaf,
  # the exporter-name vocabulary (RFC-3 decision 7): the kelvran CLI's doctor
  # validates telemetry.exporter through telemetry-exporterkind and must never
  # name telemetry here, because importing it pulls OTel into the CLI.
  telemetry:
    mayDependOn:
      - telemetry-exporterkind
  budget:
    mayDependOn:
      - telemetry
  cache-inprocess:
    mayDependOn:
      - cache
  cache-grpcserver:
    mayDependOn:
      - cache
  cache-grpcclient:
    mayDependOn:
      - cache
  bedrockguard:
    mayDependOn:
      - guardrail
      - credentialstate
  embedsim:
    mayDependOn:
      - guardrail
      - credentialstate
  idempotency-inprocess:
    mayDependOn:
      - idempotency
  streaming:
    mayDependOn:
      - adapter
  adapter-impl:
    mayDependOn:
      - adapter
      - streaming
  prompt:
    mayDependOn:
      - adapter
  ingress-anthropicmsgs:
    mayDependOn:
      - adapter
      - streaming
  dataplane:
    mayDependOn:
      - adapter
      - adapter-impl
      - alerting
      - anomaly
      - backup
      - budget
      - cache
      - configpropagation
      - costaccounting
      - credentialstate
      - gatewayevents
      - guardrail
      - identity
      - idempotency
      - ingress-anthropicmsgs
      - prompt
      - ratelimit
      - router
      - streaming
      - telemetry
  # The kelvran CLI (RFC-3 decision 1): the admin wire types, the config
  # loader/validator, identity.HashSecret, adapter.ProviderNames and the
  # exporter-name vocabulary, plus credentialstate — and nothing else. Never telemetry (OTel) and
  # never dataplane/admin: the CLI talks to a running gateway over HTTP only.
  cli:
    mayDependOn:
      - adminapi
      - controlplane
      - identity
      - adapter
      - telemetry-exporterkind
      # doctor's *_file check reads credential files with the gateway's own
      # reader (stdlib-only leaf) so the two can never disagree on "empty".
      - credentialstate
  adminapi:
    mayDependOn:
      - adapter
  admin:
    mayDependOn:
      - adapter
      - admin-auditstore
      - adminapi
      - controlplane
      - dataplane
      - identity
      - prompt
      - ratelimit
