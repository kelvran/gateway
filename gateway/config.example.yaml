# Kelvran gateway example configuration.
#
# SECURITY: never put a real secret VALUE in this file or any config file
# you actually deploy with. Every credential below is referenced by the
# NAME of an environment variable the gateway reads at startup — see
# SECURITY.md's "never commit secrets" rule and AGENTS.md's Boundaries
# section. Copy this file, adjust the non-secret fields, and set the
# named environment variables out-of-band (shell env, systemd
# EnvironmentFile, a secrets manager, etc.) — never inline a key here.

listen_addr: ":8080"

# Virtual keys are Kelvran-issued tenant credentials, not third-party
# secrets — the config holds the SHA-256 hash of each key's actual secret,
# never the secret itself. Generate a real key with:
#   openssl rand -hex 32                          # the secret you keep
#   printf '%s' '<that secret>' | sha256sum        # key_hash goes below
# Clients send "Authorization: Bearer <the raw secret, never the hash>".
# See docs/rfcs/2026-09-02-virtual-keys-budgets.md and
# docs/users/USER_GUIDE.md for the full design. The two hashes below are
# real SHA-256 digests of the made-up example secrets
# "example-team-alpha-secret-do-not-use" and
# "example-team-beta-secret-do-not-use" — safe to commit, since a hash of
# a random secret discloses nothing about the secret itself, but these
# specific example secrets are public (they're right here in this
# comment) and must never be used for anything real.
virtual_keys:
  team-alpha:
    key_hash: "6701a1ecc6b08958fa24e13f267aac7233d47f390e92e71f8cc8fb3144672cf1"
    budget_usd: 100.0
    rate_limit:
      burst: 20
      refill_per_second: 10
    allowed_models:
      gpt-4o: true
      claude-opus-4: true

  team-beta:
    # No budget_usd/rate_limit/allowed_models: unlimited budget, the
    # gateway's default rate limit, and every configured model allowed.
    key_hash: "8e43f8e74a4151a23f77bd21474a038434c56bad8c5d8bc7bb2af0d14fa95095"

# Deployments route a canonical, client-facing model name to a concrete
# upstream provider/model/endpoint. Multiple deployments may share the
# same "model" value; the dataplane round-robins across them and falls
# back to the next one on error (gateway/ARCHITECTURE.md's Request
# Lifecycle router step).
deployments:
  gpt4o-primary:
    model: "gpt-4o"
    provider: "openai"
    upstream_model: "gpt-4o"
    base_url: "https://api.openai.com/v1/chat/completions"
    api_key_env: "OPENAI_API_KEY"

  claude-opus-primary:
    model: "claude-opus-4"
    provider: "anthropic"
    upstream_model: "claude-opus-4-20250514"
    base_url: "https://api.anthropic.com/v1/messages"
    api_key_env: "ANTHROPIC_API_KEY"

# OTel span export — see docs/rfcs/2026-09-02-otel-tracing-agent-run-id.md
# and docs/operations/TELEMETRY.md. Optional: omit this whole section for
# the "stdout" default (spans printed locally, nothing shipped anywhere).
telemetry:
  exporter: "stdout" # "stdout" | "otlp" | "none"
  # otlp_endpoint: "localhost:4318"   # only read when exporter: "otlp"

# Distributed (Redis-backed) rate limiting — see
# docs/rfcs/2026-09-03-distributed-rate-limiting.md. Optional: omit this
# whole section (or leave it commented out) for the default in-memory,
# single-process token bucket, unchanged from before this RFC. Set
# redis_addr only once you're running more than one gateway instance and
# need each virtual key's burst/refill cap enforced correctly across all
# of them.
# rate_limit:
#   redis_addr: "localhost:6379"

# Cache L1 (exact-match), L2 (normalized-match), and L3-lite (lexical
# near-duplicate) — see docs/rfcs/2026-09-03-cache-l2-normalized-match.md
# and docs/rfcs/2026-09-03-cache-l3-lite-lexical-hard-gated.md. Optional:
# omit this whole section for L1's default (5-minute TTL, 10,000-entry LRU
# cap), L2's default (75-second TTL, 10,000-entry LRU cap), and L3's
# default (5-minute TTL, 10,000-entry LRU cap PER TENANT — L3's cap is
# structurally per-tenant, unlike L1/L2's single shared cap, per
# internal/cache/inprocess.LexicalCache's own tenant-isolation design). L2
# applies only a narrow, deliberately conservative allowlist (outer
# whitespace trim, Unicode NFC, trailing terminal punctuation strip on the
# last message) — see that RFC for why internal whitespace collapsing and
# case-folding were considered and rejected. L3 never serves a hit without
# passing its entity/number/date hard gate and freshness/risk model first —
# see the L3 RFC's "Never" rule in AGENTS.md before touching this.
# cache:
#   ttl_seconds: 300
#   max_entries: 10000
#   l2:
#     ttl_seconds: 75
#     max_entries: 10000
#   l3:
#     ttl_seconds: 300
#     max_entries: 10000

# Static per-model price table (USD per token), used by
# internal/costaccounting for this pass's float64 cost calculation.
# PRD.md's Decimal-precision requirement is a documented Phase 1 upgrade.
price_table:
  gpt-4o:
    prompt_per_token: 0.0000025
    completion_per_token: 0.00001

  claude-opus-4:
    prompt_per_token: 0.000015
    completion_per_token: 0.000075
