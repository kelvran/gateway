# Kelvran gateway example configuration.
#
# SECURITY: never put a real secret VALUE in this file or any config file
# you actually deploy with. Every credential below is referenced by the
# NAME of an environment variable the gateway reads at startup — see
# SECURITY.md's "never commit secrets" rule and AGENTS.md's Boundaries
# section. Copy this file, adjust the non-secret fields, and set the
# named environment variables out-of-band (shell env, systemd
# EnvironmentFile, a secrets manager, etc.) — never inline a key here.

listen_addr: ":8080"

# The gateway's own virtual key. Clients must send
# "Authorization: Bearer <value of this env var>". This pass implements
# exactly one configured key, single-tenant — see internal/identity.
api_key_env: "KELVRAN_GATEWAY_API_KEY"

# Deployments route a canonical, client-facing model name to a concrete
# upstream provider/model/endpoint. Multiple deployments may share the
# same "model" value; the dataplane round-robins across them and falls
# back to the next one on error (gateway/ARCHITECTURE.md's Request
# Lifecycle router step).
deployments:
  gpt4o-primary:
    model: "gpt-4o"
    provider: "openai"
    upstream_model: "gpt-4o"
    base_url: "https://api.openai.com/v1/chat/completions"
    api_key_env: "OPENAI_API_KEY"

  claude-opus-primary:
    model: "claude-opus-4"
    provider: "anthropic"
    upstream_model: "claude-opus-4-20250514"
    base_url: "https://api.anthropic.com/v1/messages"
    api_key_env: "ANTHROPIC_API_KEY"

# Static per-model price table (USD per token), used by
# internal/costaccounting for this pass's float64 cost calculation.
# PRD.md's Decimal-precision requirement is a documented Phase 1 upgrade.
price_table:
  gpt-4o:
    prompt_per_token: 0.0000025
    completion_per_token: 0.00001

  claude-opus-4:
    prompt_per_token: 0.000015
    completion_per_token: 0.000075
