[project]
name = "kelvran-compat-python"
version = "0.0.0"
description = "Kelvran compatibility matrix, Python leg: the official anthropic and openai packages against a running gateway (RFC-1 §11, item 11 slice S12)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "openai>=3.28.0",
    "pytest>=8.0",
]

[tool.uv]
# Tests only; nothing here is built or installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
