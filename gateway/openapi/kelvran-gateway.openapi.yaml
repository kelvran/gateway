        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SpendRow'
    SpendEraseRequest:
      description: 'POST /admin/spend/erase''s body: the session whose rows are erased.'
      type: object
      required:
      - session
      properties:
        session:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
          description: 1-128 bytes of `[A-Za-z0-9._:-]`; never `other`.
    SpendEraseResponse:
      description: 'POST /admin/spend/erase''s body: how many cells (a row inside one hour bucket) went, across every key.'
      type: object
      required:
