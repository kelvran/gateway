        '200':
          description: net/http/pprof's own output.
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 'net/http/pprof''s own: `seconds` is not a positive integer, or is combined with `debug`.'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '401':
          description: '`missing or malformed Authorization header` or `invalid admin token`; an insufficient tier is this, never 403.'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '408':
          description: 'net/http/pprof''s own: a request-context deadline passed while waiting `seconds` for the delta profile. The admin server sets no such deadline, so in practice the wait ends with
            the profile or with a client cancel (`500`).'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: 'net/http/pprof''s own: the profile could not be collected or the delta not computed, or the request was cancelled while waiting `seconds`.'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
      parameters:
      - name: seconds
        in: query
        schema:
          type: integer
          minimum: 1
        description: 'Delta profile: sample now and again after this many seconds (a positive integer, `400` otherwise; incompatible with `debug`).'
      - name: debug
        in: query
        schema:
          type: integer
        description: 'net/http/pprof''s debug level: text output when non-zero, the binary profile otherwise.'
      summary: The allocs profile.
  /admin/spend:
    servers:
    - url: http://127.0.0.1:8081
      description: The admin listener, `admin.listen_addr` (default `127.0.0.1:8081`), present only with `admin.token_env`.
    get:
      operationId: getSpend
      tags:
      - Admin
      security:
      - adminToken: []
      - viewerToken: []
      - costViewerToken: []
      summary: The spend ledger aggregated by key, model, tool or session over a window (item 13d).
      description: 'Admin and Viewer read any query. The cost-viewer tier reads only with `key=` naming one virtual key, across every `group_by` (owner gate G27); without it the answer is `401`. The window
        defaults to the last 24 hours ending now and is clamped to the ledger''s `retention_hours`; the response carries the window as served. Rows come sorted by spend, highest first; a key with no rows
        is an empty array, not an error. `other` is the fold target: the sessions beyond `ledger.max_sessions_per_key` and the cells beyond `ledger.max_rows_per_key`.'
      parameters:
      - name: group_by
        in: query
        required: true
        schema:
          type: string
          enum:
          - key
          - model
          - tool
          - session
        description: The dimension to aggregate by (`400` otherwise). `key` is kept on every row when the query names one key or groups by session.
      - name: key
        in: query
        schema:
          type: string
        description: One virtual key; required for the cost-viewer tier (`401` without it). An unknown key yields an empty row list.
      - name: since
        in: query
        schema:
          type: string
          format: date-time
        description: 'Lower bound, RFC 3339 (`400` otherwise); default `until` minus 24 hours; clamped to now minus `ledger.retention_hours`. Buckets are hours: the bucket containing `since` is included
          whole.'
      - name: until
        in: query
        schema:
          type: string
          format: date-time
        description: Upper bound, exclusive, RFC 3339 (`400` otherwise); default now; must be after `since` (`400` otherwise). A window that lies entirely before the retention floor is served as `[floor,
          floor)` with no rows.
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendResponse'
              examples:
                golden:
                  summary: One key's spend by session over the served window
                  value:
                    group_by: session
                    key: team-a
                    since: '2026-10-10T01:02:03Z'
                    until: '2026-10-11T01:02:03Z'
                    rows:
                    - key: team-a
                      session: sess-1
                      spend_usd: '1.25'
                      requests: 3
                  x-kelvran-example-source: gateway/internal/adminapi/testdata/wire.golden.json#/SpendResponse
                empty:
                  summary: A window with no rows
                  value:
                    group_by: key
                    since: '2026-10-10T01:02:03Z'
                    until: '2026-10-11T01:02:03Z'
                    rows: []
                  x-kelvran-example-source: gateway/internal/adminapi/testdata/wire.golden.json#/SpendResponse.empty
        '400':
          description: '`group_by must be one of key, model, tool, session`; `since "<v>" is not a valid RFC 3339 timestamp: …`; `until "<v>" is not a valid RFC 3339 timestamp: …`; `until must be after
            since`.'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '401':
          description: '`missing or malformed Authorization header` or `invalid admin token`; an insufficient tier is this, never 403. The cost-viewer tier without `key=` is `cost_viewer may read /admin/spend
            only with key= naming one virtual key` (G27).'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: 'The ledger could not be read within 10 s (`querying spend ledger: …`, naming hours and keys, never a session), or encoding the response failed (`encoding response`).'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
  /admin/spend/erase:
    servers:
    - url: http://127.0.0.1:8081
      description: The admin listener, `admin.listen_addr` (default `127.0.0.1:8081`), present only with `admin.token_env`.
    post:
      operationId: eraseSpendSession
      tags:
      - Admin
      security:
      - adminToken: []
      summary: Erase one session's rows from the spend ledger (item 13d; Admin only).
      description: 'Irreversible and cross-tenant by nature (a session id is not scoped to a key), so Admin only (owner gate G28). Removes the session''s cells from every key and hour on this replica''s
        ledger — bbolt and in-memory modes need one call per replica; the Redis backend is shared. Rows already folded into `other` cannot be erased on their own: `other` goes with its key (`DELETE /admin/virtual_keys/{name}`)
        or by retention. The body is bounded at 4 KiB. The audit line carries a 16-hex SHA-256 prefix of the session and `rows_erased`, never the id.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpendEraseRequest'
            examples:
              golden:
                summary: The session to erase
                value:
                  session: sess-1
                x-kelvran-example-source: gateway/internal/adminapi/testdata/wire.golden.json#/SpendEraseRequest
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendEraseResponse'
              examples:
                golden:
                  summary: How many cells went
                  value:
                    rows_erased: 2
                  x-kelvran-example-source: gateway/internal/adminapi/testdata/wire.golden.json#/SpendEraseResponse
        '400':
          description: 'A body that is not JSON or over 4 KiB (`invalid request body: …`), `session is required`, `session "other" cannot be erased on its own: it is the fold target, removed only with its
            key or by retention`, or `session must be 1-128 bytes of [A-Za-z0-9._:-]`.'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '401':
          description: '`missing or malformed Authorization header` or `invalid admin token`; an insufficient tier is this, never 403.'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '500':
          description: 'The ledger could not erase within 10 s (`erasing spend ledger session: …`), or encoding the response failed (`encoding response`).'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
components:
  securitySchemes:
    virtualKey:
      type: http
      scheme: bearer
      description: 'A virtual key''s raw secret as `Authorization: Bearer <secret>`; the gateway matches its SHA-256 against the key''s `key_hash`. Admin tokens never authenticate on `/v1/*`.

        '
    virtualKeyXAPIKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'The bearer''s alias on `/v1/models`, `/v1/messages` and `/v1/messages/count_tokens` (the Anthropic SDKs'' and Claude Code''s header). A non-empty `Authorization` wins, so exactly one
        credential is ever verified; a wrong bearer beside a valid `x-api-key` is `401`.

        '
    adminToken:
      type: http
      scheme: bearer
      description: 'The admin tier, the token in the environment variable named by `admin.token_env`. Virtual keys never authenticate on `/admin/*`.

        '
    viewerToken:
      type: http
      scheme: bearer
      description: 'The read-only viewer tier, `admin.viewer_token_env`; authenticates nothing when unset.

        '
    costViewerToken:
      type: http
      scheme: bearer
      description: 'The cost-viewer tier, `admin.cost_viewer_token_env`; authenticates only `GET /admin/virtual_keys/{name}/spend`.

        '
    operatorToken:
      type: http
      scheme: bearer
      description: 'The operator tier, `admin.operator_token_env`; authenticates only the three reversible, single-target writes (rotate, reweight, cache erase).

        '
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Opaque client-chosen key, scoped to the authenticating virtual key; the same key with a different body is `422` `idempotency_key_reused`. On `/v1/messages` the fingerprint is the body
        as received plus the normalised `anthropic-beta` set. Not read by `/v1/embeddings`, `/v1/models` or `/v1/messages/count_tokens`.
    EndUserID:
      name: X-Kelvran-End-User-Id
      in: header
      required: false
      schema:
        type: string
      description: 'Caller-supplied, unauthenticated end-user identifier; partitions the response cache only for keys with `cache_scope_to_end_user: true`. On `/v1/messages` the body''s `metadata.user_id`
        fills the same scope when the header is absent; the header wins when both are present.'
    AnthropicVersion:
      name: anthropic-version
      in: header
      required: false
      schema:
        type: string
      description: One of the `anthropic-*` request headers the two Anthropic routes forward to an `anthropic` deployment (the client's value replaces the gateway's default); the family is bounded at 16
        KiB in total, `400` `invalid_request` beyond. The per-provider policy is in the data-plane reference.
    AnthropicBeta:
      name: anthropic-beta
      in: header
      required: false
      schema:
        type: string
      description: One of the `anthropic-*` request headers the two Anthropic routes forward to an `anthropic` deployment; on `/v1/messages` its normalised set is part of the `Idempotency-Key` fingerprint.
        Bounded with the rest of the family at 16 KiB in total.
  headers:
    X-Kelvran-Overhead-Duration-Ms:
      description: 'Whole milliseconds the gateway spent outside the upstream call; on buffered `200`s of `/v1/chat/completions` and `/v1/messages` only (never on a stream).

        '
      schema:
        type: string
        pattern: ^[0-9]+$
    Retry-After:
      description: 'Whole seconds to wait, the key''s own backoff (500 ms doubling to 30 s, rounded up, floor 1) floored by an upstream `Retry-After` capped at 60 s. Present exactly where the response''s
        `x-kelvran-retry-after` list names the answer''s `code`.

        '
      schema:
        type: integer
        minimum: 1
    Allow:
      description: 'The one method the route accepts; on every data-plane JSON `405`, never on the plain-text ones.

        '
      required: true
      schema:
        type: string
    X-Content-Type-Options:
      description: '`nosniff`; on every JSON error body and on the `200`s of `/v1/models`, buffered `/v1/messages` and `/v1/messages/count_tokens`.

        '
      schema:
        type: string
        const: nosniff
    x-should-retry:
      description: 'Relayed from an `anthropic` deployment, never synthesised; with the `anthropic-ratelimit-unified-*` family (`x-kelvran-relayed-header-prefix`) on `/v1/messages` and `/v1/messages/count_tokens`
        answers served by one.

        '
      schema:
        type: string
      x-kelvran-relayed-header-prefix: anthropic-ratelimit-unified-
    Cache-Control:
      description: '`no-cache`, on the two streaming `200`s.

        '
      schema:
        type: string
        const: no-cache
    Connection:
      description: '`keep-alive`, on the two streaming `200`s.

        '
      schema:
        type: string
        const: keep-alive
  schemas:
    ErrorCode:
      description: 'Every machine-readable `code` the gateway emits, on either envelope. Equality with the code is pinned by `TestOpenAPIStatusesAndCodes`.

        '
      type: string
      enum:
      - method_not_allowed
      - request_too_large
      - invalid_body
      - invalid_json
      - invalid_tool_choice
      - invalid_request
      - missing_required_parameter
      - invalid_api_key
      - key_expired
      - model_not_allowed
      - source_ip_not_allowed
      - model_not_found
      - content_policy_violation
      - empty_messages
      - invalid_prompt_reference
      - streaming_not_supported
      - response_format_unsupported
      - tool_result_parts_unsupported
      - system_parts_unsupported
      - lossy_ingress_rejected
      - not_an_embedding_model
      - idempotency_key_reused
      - rate_limit_exceeded
      - concurrency_limit_exceeded
      - insufficient_quota
      - streaming_not_configured
      - embeddings_not_configured
      - upstream_error
      - deployment_capacity_exceeded
      - count_tokens_unavailable
    OpenAIError:
      description: 'The OpenAI-shaped envelope of every error on `/v1/chat/completions`, `/v1/embeddings`, `/v1/models` and `HEAD /api/hello`''s `405`. All four keys are always present (`null` when unknown).
        Written as `application/json; charset=utf-8` with `X-Content-Type-Options: nosniff`.

        '
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - message
          - type
          - param
          - code
          additionalProperties: false
          properties:
            message:
              type: string
            type:
              type: string
              enum:
              - invalid_request_error
              - authentication_error
              - permission_error
              - rate_limit_error
              - insufficient_quota
              - server_error
            param:
              type:
              - string
              - 'null'
            code:
              oneOf:
              - $ref: '#/components/schemas/ErrorCode'
              - type: 'null'
    OpenAIStreamErrorFrame:
      description: 'The one in-band `data:` frame a `/v1/chat/completions` stream carries when it fails after the first byte; `param` is always `null` and no `data: [DONE]` follows.

        '
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - message
          - type
          - param
          - code
          additionalProperties: false
          properties:
            message:
              type: string
            type:
              type: string
              enum:
              - invalid_request_error
              - authentication_error
              - permission_error
              - rate_limit_error
              - insufficient_quota
              - server_error
            param:
              type: 'null'
            code:
              oneOf:
              - $ref: '#/components/schemas/ErrorCode'
              - type: 'null'
    KelvranAnthropicError:
      description: 'The Anthropic-shaped envelope of every error the gateway itself writes on `/v1/messages` and `/v1/messages/count_tokens` (their `405`s included). `type` follows the status (`401` authentication_error,
        `403` permission_error, `404` not_found_error, `413` request_too_large, `429` rate_limit_error, `5xx` api_error, else invalid_request_error); `code` and `param` are omitted when unknown. A `message`
        may begin with `capability_rejected: prompt_too_long` on an upstream context-window rejection.

        '
      type: object
      required:
      - type
      - error
      additionalProperties: false
      properties:
        type:
          type: string
          const: error
        error:
          type: object
          required:
          - type
          - message
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
              - invalid_request_error
              - authentication_error
              - permission_error
              - not_found_error
              - request_too_large
              - rate_limit_error
              - api_error
            message:
              type: string
            code:
              $ref: '#/components/schemas/ErrorCode'
            param:
              type: string
    AnthropicUpstreamError:
      description: 'An `anthropic` deployment''s own `400` or `422` body, relayed verbatim with its status and its `x-should-retry` / `anthropic-ratelimit-unified-*` headers, carrying no Kelvran `code`,
        `param` or `Retry-After` (RFC-1 §9). Permissive by construction.

        '
      type: object
      required:
      - type
      - error
      additionalProperties: true
      x-kelvran-passthrough: anthropic
      properties:
        type:
          type: string
          const: error
        error:
          type: object
          required:
          - type
          - message
          additionalProperties: true
          properties:
            type:
              type: string
            message:
              type: string
    AnthropicStreamErrorEvent:
      description: 'The one `event: error` a `/v1/messages` stream carries when it fails after the first byte; `type` and `message` only.

        '
      type: object
      required:
      - type
      - error
      additionalProperties: false
      properties:
        type:
          type: string
          const: error
        error:
          type: object
          required:
          - type
          - message
          additionalProperties: false
          properties:
            type:
              type: string
            message:
              type: string
    PlainTextError:
      description: '`http.Error` text with a trailing newline: healthz/readyz `405` (no `Allow`) and readyz `500`; every admin error; net/http''s `Method Not Allowed` and `404 page not found`.

        '
      type: string
    CacheControl:
      type: object
      additionalProperties: true
      properties:
        ttl:
          type: string
        key:
          type: string
    ContentPart:
      type: object
      required:
      - type
      additionalProperties: true
      properties:
        type:
          type: string
        text:
          type: string
        media_type:
          type: string
        data:
          type: string
          description: Base64 inline data.
        url:
          type: string
        cache_control:
          $ref: '#/components/schemas/CacheControl'
    ReasoningBlock:
      type: object
      required:
      - sequence
      additionalProperties: true
      properties:
        sequence:
          type: integer
        redacted:
          type: boolean
        text:
          type: string
        data:
          type: string
        signature:
          type: string
    ToolCall:
      description: 'The OpenAI tool-call wire shape (`toolCallWire`); `arguments` is a JSON-encoded string.

        '
      type: object
      required:
      - id
      - type
      - function
      additionalProperties: true
      properties:
        id:
          type: string
        type:
          type: string
          const: function
        function:
          type: object
          required:
          - name
          - arguments
          additionalProperties: true
          properties:
            name:
              type: string
            arguments:
              type: string
    Message:
      type: object
      required:
      - role
      additionalProperties: true
      properties:
        role:
          type: string
        content:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ContentPart'
          description: 'Kelvran extension, multimodal parts; a non-text part on a `role: system` message is `400` `system_parts_unsupported`, on a `role: tool` message `400` `tool_result_parts_unsupported`
            when no deployment in the pool can carry it.

            '
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        tool_call_id:
          type: string
        cache_control:
          $ref: '#/components/schemas/CacheControl'
        refusal:
          type: string
        reasoning_blocks:
          type: array
          items:
            $ref: '#/components/schemas/ReasoningBlock'
    ToolDef:
      description: 'The OpenAI function-tool wire shape (`toolDefWire`).

        '
      type: object
      required:
      - type
      - function
      additionalProperties: true
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          required:
          - name
          additionalProperties: true
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              description: A JSON Schema object, passed through to the provider.
        cache_control:
          $ref: '#/components/schemas/CacheControl'
        strict:
          type: boolean
    ToolChoice:
      description: 'The three inbound forms the gateway accepts; anything else is `400` `invalid_tool_choice` (`param` `tool_choice`), including an object that sets both `mode` and `type`, which matches
        neither object form here.

        '
      oneOf:
      - type: string
        enum:
        - auto
        - required
        - none
      - type: object
        required:
        - type
        - function
        additionalProperties: true
        properties:
          type:
            type: string
            const: function
          function:
            type: object
            required:
            - name
            additionalProperties: true
            properties:
              name:
                type: string
        not:
          required:
          - mode
      - type: object
        required:
        - mode
        additionalProperties: true
        properties:
          mode:
            type: string
            enum:
            - auto
            - required
            - none
            - tool
          tool_name:
            type: string
          disable_parallel_tool_use:
            type: boolean
        not:
          required:
          - type
    JSONSchema:
      type: object
      required:
      - name
      - schema
      additionalProperties: true
      properties:
        name:
          type: string
        strict:
          type: boolean
        schema:
          description: 'A JSON Schema object: depth at most 32 and at most 10000 tokens.'
    ResponseFormat:
      type: object
      required:
      - type
      additionalProperties: true
      properties:
        type:
          type: string
        json_schema:
          $ref: '#/components/schemas/JSONSchema'
    ChatCompletionRequest:
      description: 'The OpenAI Chat Completions request plus Kelvran''s extensions (`prompt_id`, `prompt_version`, `prompt_label`,

        `prompt_variables`, `thinking_binding_mode`, `parts` and `reasoning_blocks` on messages, the canonical

        `tool_choice` object). Either `messages` or `prompt_id` supplies the conversation — one of them, never both (`400` `invalid_prompt_reference`); a request that resolves to no messages is `400` `empty_messages`.
        Decoded with `encoding/json`: unknown members are ignored at every depth. At most 2000 messages and

        256 tools; no single string field beyond 8 MiB. `stop` is a string or an array of strings.

        '
      type: object
      required:
      - model
      additionalProperties: true
      properties:
        model:
          type: string
        messages:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/Message'
        temperature:
          type: number
        max_tokens:
          type: integer
        stop:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        top_p:
          type: number
        tools:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/ToolDef'
        stream:
          type: boolean
        response_format:
          $ref: '#/components/schemas/ResponseFormat'
        prompt_id:
          type: string
          description: 'Kelvran extension: a server-side prompt whose content replaces `messages`, which must then be absent or empty.'
        prompt_version:
          type: integer
        prompt_label:
          type: string
        prompt_variables:
          type: object
          additionalProperties:
            type: string
        tool_choice:
          $ref: '#/components/schemas/ToolChoice'
        thinking_binding_mode:
          type: string
    Usage:
      type: object
      required:
      - prompt_tokens
      - completion_tokens
