      description: 'GET /admin/spend''s body: the query as served (`since` after the retention clamp, `until` as given or now, RFC 3339) and its rows, sorted by spend, highest first; an empty array when
        nothing matched.'
      type: object
      required:
      - group_by
      - since
      - until
      - rows
      additionalProperties: false
      properties:
        group_by:
          type: string
          enum:
          - key
