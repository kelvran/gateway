          additionalProperties: true
        Prompt:
          type: object
          additionalProperties: true
        RateLimit:
          type: object
          additionalProperties: true
        ConfigPropagation:
          type: object
          additionalProperties: true
        Cache:
          type: object
          additionalProperties: true
        Guardrails:
          type: object
          additionalProperties: true
        Admin:
          type: object
          additionalProperties: true
        HealthProbe:
          type: object
          additionalProperties: true
        Alerting:
          type: object
          additionalProperties: true
        CredentialReload:
          type: object
          additionalProperties: true
    AnthropicMessagesRequest:
      description: 'The Anthropic Messages request, permissive by construction (RFC-1 Option C): the known members are typed

        loosely here, and every member at any depth that the canonical schema has no home for is kept in the

        passthrough record — an `anthropic` deployment receives the body as sent, with only `model` and `stream` rewritten on the top level, and the canonical shadow is still scanned by the pre-call guardrail;
        a translate hop refuses it with

        `400` `lossy_ingress_rejected` (`param` lists the JSON pointers) unless the deployment sets

        `accept_lossy_anthropic_ingress: true`. A duplicate member at any depth, nesting beyond 64 levels or invalid

        UTF-8 is `400` `invalid_json`; `metadata.user_id` is capped at 256 bytes (`400` `invalid_request`).

        '
      type: object
      required:
      - model
      - max_tokens
      - messages
      additionalProperties: true
      x-kelvran-passthrough: anthropic
      properties:
        model:
          type: string
        max_tokens:
          type: integer
        messages:
          type: array
          maxItems: 2000
          items:
            type: object
            required:
            - content
            additionalProperties: true
            properties:
              role:
                type: string
                description: Read when present; the gateway's parser demands only `content` and does not supply a `role` that is missing — the deployment's provider judges it (an `anthropic` deployment
                  receives the body as sent).
              content:
                oneOf:
                - type: string
                - type: array
                  items:
                    type: object
                    additionalProperties: true
        system:
          oneOf:
          - type: string
          - type: array
            items:
              type: object
              additionalProperties: true
        tools:
          type: array
          maxItems: 256
          items:
            type: object
            additionalProperties: true
        tool_choice:
          type: object
          additionalProperties: true
        thinking:
          type: object
          additionalProperties: true
        output_config:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
          properties:
            user_id:
              type: string
              maxLength: 256
        stream:
          type: boolean
        stop_sequences:
          type: array
          items:
            type: string
        temperature:
          type: number
        top_p:
          type: number
        top_k:
          type: integer
    AnthropicMessage:
      description: 'A Messages response. On the translate path the gateway''s encoder always emits `type: message`; on the

        passthrough path the bytes are the `anthropic` deployment''s own, relayed verbatim (a real Anthropic answer

        carries `type` too, the gateway''s own compat mock does not), so `type` is optional here and the shape is

        permissive by construction.

        '
      type: object
      required:
      - id
      - role
      - content
      - model
      - stop_reason
      - usage
      additionalProperties: true
      x-kelvran-passthrough: anthropic
      properties:
        id:
          type: string
        type:
          type: string
          const: message
        role:
          type: string
          const: assistant
        model:
          type: string
        content:
          type: array
          items:
            type: object
            required:
            - type
            additionalProperties: true
            properties:
              type:
                type: string
              text:
                type: string
              id:
                type: string
              name:
                type: string
              input: {}
              thinking:
                type: string
              signature:
                type: string
              data:
                type: string
        stop_reason:
          type:
          - string
          - 'null'
        stop_sequence:
          type:
          - string
          - 'null'
        usage:
          type: object
          required:
          - input_tokens
          - output_tokens
          additionalProperties: true
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            cache_read_input_tokens:
              type: integer
            cache_creation_input_tokens:
              type: integer
            output_tokens_details:
              type: object
              additionalProperties: true
              properties:
                thinking_tokens:
                  type: integer
        input_transformations:
          type: array
          items:
            $ref: '#/components/schemas/InputTransformation'
    AnthropicStreamEvent:
      description: One `data:` payload of a `/v1/messages` stream, discriminated by `type`; payloads are permissive by construction.
      type: object
      required:
      - type
      additionalProperties: true
      x-kelvran-passthrough: anthropic
      properties:
        type:
          type: string
          enum:
          - message_start
          - content_block_start
          - content_block_delta
          - content_block_stop
          - message_delta
          - message_stop
          - ping
          - error
    AnthropicCountTokensRequest:
      description: The Anthropic `count_tokens` body — a Messages request without `max_tokens`; permissive by construction. The handler reads the whole body (32 MiB cap) and demands `model` on every deployment;
        only an `anthropic` deployment with the `count_tokens` upstream wired then parses it into the canonical shadow (where `messages` is demanded), scans that with the pre-call guardrail and forwards
        the body as received with only `model` rewritten on the top level — every other deployment answers `404` `count_tokens_unavailable` without parsing further.
      type: object
      required:
      - model
      additionalProperties: true
      x-kelvran-passthrough: anthropic
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 'Demanded (`400` `missing_required_parameter`, `param` `messages`) only where the body is parsed: an `anthropic` deployment with the `count_tokens` upstream wired.'
        system: {}
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_choice:
          type: object
          additionalProperties: true
        thinking:
          type: object
          additionalProperties: true
    AnthropicCountTokensResponse:
      description: The `anthropic` deployment's own answer, relayed verbatim (at most 64 KiB).
      type: object
      required:
      - input_tokens
      additionalProperties: true
      x-kelvran-passthrough: anthropic
      properties:
        input_tokens:
          type: integer
    SpendRow:
      description: 'One aggregate of GET /admin/spend: the grouped dimension (the others omitted), plus `key` when the query named one key or grouped by session; `spend_usd` is a decimal string in USD,
        `requests` the billed request count.'
      type: object
      required:
      - spend_usd
