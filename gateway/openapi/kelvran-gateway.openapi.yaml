openapi: 3.1.0
info:
  title: Kelvran gateway
  version: 0.20.0
  summary: The HTTP surface of the Kelvran LLM gateway, both listeners.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: "Two listeners, one process. The data plane (`listen_addr`, required; `config.example.yaml` sets `:8080`)\nserves the OpenAI-shaped `/v1/chat/completions`, `/v1/embeddings` and `/v1/models`,\
    \ the Anthropic-shaped\n`/v1/messages` and `/v1/messages/count_tokens`, the probes `/healthz`, `/readyz` and `HEAD /api/hello`.\nThe admin listener (`admin.listen_addr`, default `127.0.0.1:8081`) exists\
    \ only when `admin.token_env` is set\nand serves TLS only when `admin.mtls` is configured; its operations carry their own `servers` entry.\n\nWhat the OpenAPI vocabulary cannot carry, stated here and\
    \ pinned by the gateway's own tests\n(`TestOpenAPI*` in `gateway/cmd/gateway`, `TestAdminServeMuxSemantics` in `gateway/internal/admin`):\n\n- Data-plane patterns carry no method, so a wrong method\
    \ is the route's own `405` in the route's own\n  envelope (OpenAI JSON with `Allow` on chat, embeddings, models and hello; Anthropic JSON with `Allow` on\n  messages and count_tokens; plain text without\
    \ `Allow` on healthz and readyz). A `HEAD` on a route that\n  does not accept it arrives as that route's `405` (`Allow` only on the JSON routes) with the body stripped by the server.\n- Admin patterns\
    \ carry a method, so a wrong method on a known admin path is net/http's plain-text `405`\n  with `Allow`, answered before any bearer check; every admin `GET` also answers `HEAD` (same status and\n \
    \ headers, no body); `/admin/debug/pprof/` is a subtree and `/admin/debug/pprof` without the slash is a\n  `307` redirect to it under the pinned Go toolchain. Neither the HEAD legs nor the redirect\
    \ are operations.\n- Unknown paths are plain-text `404` on both listeners. The gateway adds no correlation header of its own: the only correlation inputs are W3C `traceparent`/`tracestate` and `baggage`.\
    \ An admin credential of an insufficient tier is\n  `401`, never `403`.\n- Body caps: the data plane reads at most 32 MiB (`413` `request_too_large`), the admin listener has no cap;\n  `anthropic-*`\
    \ request headers forwarded on the two Anthropic routes are bounded at 16 KiB; an `anthropic`\n  deployment's `count_tokens` answer is relayed up to 64 KiB.\n- `POST /v1/messages` and `POST /v1/messages/count_tokens`\
    \ request schemas are permissive by construction\n  (RFC-1 Option C): members the canonical schema does not know reach an `anthropic` deployment as sent (only `model` and `stream` are rewritten on the\
    \ top level; the canonical shadow is still scanned by the pre-call guardrail) and\n  are refused with `400` `lossy_ingress_rejected` on a translate hop unless the deployment sets\n  `accept_lossy_anthropic_ingress:\
    \ true`.\n\nPublic surface under `docs/VERSIONING.md` §2 from `gateway/v0.20.0`, and a `gateway/v1.0.0` precondition (frozen across two consecutive minors)\nunder its §4: paths, operations, operationIds,\
    \ security requirements, response statuses, header names, the\n`type`/`code` vocabularies and every `x-kelvran-*` value. Description prose, example payloads and\n`info.version` are not. The prose reference\
    \ is `docs/reference/data-plane-api.md`,\n`docs/reference/admin-api.md`, `docs/reference/error-codes.md` and `docs/reference/config.md`.\n"
servers:
- url: http://127.0.0.1:8080
  description: 'The data plane, `listen_addr` (no default; `config.example.yaml` sets `:8080`).

    '
tags:
- name: Data plane
  description: 'The OpenAI-shaped and Anthropic-shaped model routes on the data-plane listener, authenticated by a virtual key.

    '
- name: Health
  description: 'Probes on the data-plane listener, no credential read. A wrong method is a plain-text `405` without `Allow` on `/healthz` and `/readyz`, and the OpenAI envelope with `Allow` on `/api/hello`.

    '
- name: Admin
  description: 'The admin listener. Bearer tokens only (`Authorization: Bearer <token>`, literal `Bearer ` prefix and at least one character),

    compared in constant time against the four static tiers named by `admin.token_env`, `admin.viewer_token_env`,

    `admin.cost_viewer_token_env` and `admin.operator_token_env`. Every admin error is `http.Error` plain text with

    `X-Content-Type-Options: nosniff` and a trailing newline; never a JSON envelope, never `Retry-After`. No request-body

    limit. Patterns carry a method: a wrong method is net/http''s plain-text `405` with `Allow`, before the token check,

    and every `GET` also answers `HEAD`.

    '
- name: Debug
  description: 'pprof under `/admin/debug/pprof/`, registered only with `admin.enable_pprof: true`, admin tier only. `/admin/debug/pprof/` is a subtree pattern; `/admin/debug/pprof` without the slash redirects
    `307`. The handlers are net/http/pprof''s own, including their plain-text `400`/`500`.

    '
x-kelvran-servemux:
  data_plane:
    method_in_pattern: false
  admin:
    method_in_pattern: true
    wrong_method:
      status: 405
      content_type: text/plain; charset=utf-8
      allow_header: true
      before_auth: true
    head_for_get: true
    subtree_patterns:
    - GET /admin/debug/pprof/
    redirects:
    - from: /admin/debug/pprof
      to: /admin/debug/pprof/
      status: 307
x-kelvran-extensions:
- x-kelvran-servemux
- x-kelvran-extensions
- x-kelvran-conditional
- x-kelvran-subtree
- x-kelvran-method-not-allowed
- x-kelvran-codes
- x-kelvran-retry-after
- x-kelvran-passthrough
- x-kelvran-example-source
- x-kelvran-max-body-bytes
- x-kelvran-sse-events
- x-kelvran-relayed-header-prefix
- x-kelvran-when-unconfigured
- x-kelvran-schema
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      tags:
      - Data plane
      summary: OpenAI Chat Completions, buffered or streamed.
      security:
      - virtualKey: []
      x-kelvran-max-body-bytes: 33554432
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/EndUserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              toolTurn:
                summary: A tool-use conversation, the OpenAI adapter's canonical request fixture
                value:
                  model: gpt-4o
                  messages:
                  - role: system
                    content: You are a helpful assistant that can check the weather.
                  - role: user
                    content: What's the weather in Boston?
                  - role: assistant
                    tool_calls:
                    - id: call_abc123
                      type: function
                      function:
                        name: get_weather
                        arguments: '{"city":"Boston","unit":"fahrenheit"}'
                  - role: tool
                    content: '{"temperature":72,"condition":"sunny"}'
                    tool_call_id: call_abc123
                  - role: assistant
                    content: It's 72°F and sunny in Boston.
                  temperature: 0.3
                  max_tokens: 1024
                  tools:
                  - type: function
                    function:
                      name: get_weather
                      description: Get the current weather for a given city
                      parameters:
                        type: object
                        properties:
                          city:
                            type: string
                          unit:
                            type: string
                            enum:
                            - celsius
                            - fahrenheit
                        required:
                        - city
                x-kelvran-example-source: gateway/internal/adapter/openai/testdata/request_canonical.json
      responses:
        '200':
          description: 'Buffered: the completion. `stream: true`: `text/event-stream` of `data: <ChatCompletionChunk>` frames then `data: [DONE]`; a failure after the first byte is one in-band `data: <OpenAIStreamErrorFrame>`
            and no `[DONE]`.'
          headers:
            X-Kelvran-Overhead-Duration-Ms:
              $ref: '#/components/headers/X-Kelvran-Overhead-Duration-Ms'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Connection:
              $ref: '#/components/headers/Connection'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
              examples:
                buffered:
                  summary: A buffered completion with the gateway's stamped id, object and created
                  value:
                    id: chatcmpl-9f2a3c1e7b
                    object: chat.completion
                    created: 1760169600
                    model: gpt-4o
                    choices:
                    - index: 0
                      message:
                        role: assistant
                        content: It's 72°F and sunny in Boston.
                      finish_reason: stop
                    usage:
                      prompt_tokens: 58
                      completion_tokens: 12
                      total_tokens: 70
                  x-kelvran-example-source: hand-authored
            text/event-stream:
              schema:
                type: string
              x-kelvran-sse-events:
              - 'data: <ChatCompletionChunk>'
              - 'data: [DONE]'
              - 'data: <OpenAIStreamErrorFrame> (then no [DONE])'
        '400':
          description: Request-shape faults and guardrail blocks.
          x-kelvran-codes:
          - model_not_found
          - content_policy_violation
          - empty_messages
          - invalid_prompt_reference
          - streaming_not_supported
          - response_format_unsupported
          - tool_result_parts_unsupported
          - system_parts_unsupported
          - invalid_body
          - invalid_json
          - invalid_tool_choice
          - invalid_request
          x-kelvran-retry-after:
          - streaming_not_supported
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '401':
          description: Missing, malformed, unknown or expired credential (`code` is `null` when the header is missing or malformed).
          x-kelvran-codes:
          - invalid_api_key
          - key_expired
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
              examples:
                missingHeader:
                  summary: No Authorization header (code is null)
                  value:
                    error:
                      message: 'dataplane: auth: identity: missing or malformed Authorization header'
                      type: authentication_error
                      param: null
                      code: null
                  x-kelvran-example-source: hand-authored
        '403':
          description: The key may not use this model, or the source IP is outside the key's allow-list.
          x-kelvran-codes:
          - model_not_allowed
          - source_ip_not_allowed
          x-kelvran-retry-after:
          - source_ip_not_allowed
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '405':
          description: 'Any method but POST: the route''s own OpenAI envelope with `Allow`.'
          x-kelvran-codes:
          - method_not_allowed
          x-kelvran-retry-after: []
          headers:
            Allow:
              $ref: '#/components/headers/Allow'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
          x-kelvran-method-not-allowed:
            status: 405
            allow: POST
            content_type: application/json; charset=utf-8
            body: openai-envelope
        '413':
          description: Body over 32 MiB.
          x-kelvran-codes:
          - request_too_large
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '422':
          description: '`Idempotency-Key` reused within its window with a different body.'
          x-kelvran-codes:
          - idempotency_key_reused
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '429':
          description: The key's RPM/TPM or concurrency ceiling, or its budget.
          x-kelvran-codes:
          - rate_limit_exceeded
          - concurrency_limit_exceeded
          - insufficient_quota
          x-kelvran-retry-after:
          - rate_limit_exceeded
          - concurrency_limit_exceeded
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '501':
          description: '`stream: true` with no streaming client configured.'
          x-kelvran-codes:
          - streaming_not_configured
          x-kelvran-retry-after:
          - streaming_not_configured
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '502':
          description: Every upstream failure, redacted.
          x-kelvran-codes:
          - upstream_error
          x-kelvran-retry-after:
          - upstream_error
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '503':
          description: Every deployment in the pool is at its own ceiling.
          x-kelvran-codes:
          - deployment_capacity_exceeded
          x-kelvran-retry-after:
          - deployment_capacity_exceeded
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
  /v1/embeddings:
    post:
      operationId: createEmbedding
      tags:
      - Data plane
      summary: OpenAI embeddings.
      security:
      - virtualKey: []
      x-kelvran-max-body-bytes: 33554432
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
      responses:
        '200':
          description: The embeddings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
        '400':
          description: Request-shape faults, a chat-kind model, a guardrail block.
          x-kelvran-codes:
          - model_not_found
          - content_policy_violation
          - not_an_embedding_model
          - invalid_body
          - invalid_json
          - missing_required_parameter
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '401':
          description: Missing, malformed, unknown or expired credential.
          x-kelvran-codes:
          - invalid_api_key
          - key_expired
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '403':
          description: Model or source-IP allow-list.
          x-kelvran-codes:
          - model_not_allowed
          - source_ip_not_allowed
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '405':
          description: 'Any method but POST: the route''s own OpenAI envelope with `Allow`.'
          x-kelvran-codes:
          - method_not_allowed
          x-kelvran-retry-after: []
          headers:
            Allow:
              $ref: '#/components/headers/Allow'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
          x-kelvran-method-not-allowed:
            status: 405
            allow: POST
            content_type: application/json; charset=utf-8
            body: openai-envelope
        '413':
          description: Body over 32 MiB.
          x-kelvran-codes:
          - request_too_large
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '429':
          description: The key's rate limit or budget; never `Retry-After` on this route.
          x-kelvran-codes:
          - rate_limit_exceeded
          - insufficient_quota
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '501':
          description: No embedding client configured.
          x-kelvran-codes:
          - embeddings_not_configured
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '502':
          description: Upstream failure, redacted; no fallback and no `Retry-After` on this route.
          x-kelvran-codes:
          - upstream_error
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
  /v1/models:
    get:
      operationId: listModels
      tags:
      - Data plane
      summary: The canonical models this key may use, in the OpenAI, Anthropic and Claude Code shapes at once.
      security:
      - virtualKey: []
      - virtualKeyXAPIKey: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
        description: Clamped to 1000; empty means all. Invalid is `400` `invalid_request` (`param` `limit`), checked before authentication.
      - name: after_id
        in: query
        schema:
          type: string
        description: Cursor; mutually exclusive with `before_id` (`400` `invalid_request`, `param` `after_id`); an unknown cursor is `400` after authentication.
      - name: before_id
        in: query
        schema:
          type: string
        description: Cursor; mutually exclusive with `after_id` (`400` `invalid_request`, `param` `after_id`); an unknown cursor is `400` `invalid_request` with `param` `before_id`, after authentication.
      responses:
        '200':
          description: The list. No rate limit, budget, guardrail or upstream call is involved.
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '400':
          description: Bad `limit`, both cursors, or an unknown cursor.
          x-kelvran-codes:
          - invalid_request
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '401':
          description: Missing, malformed, unknown or expired credential.
          x-kelvran-codes:
          - invalid_api_key
          - key_expired
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '403':
          description: Source IP outside the key's allow-list.
          x-kelvran-codes:
          - source_ip_not_allowed
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
        '405':
          description: 'Any method but GET: the route''s own OpenAI envelope with `Allow`.'
          x-kelvran-codes:
          - method_not_allowed
          x-kelvran-retry-after: []
          headers:
            Allow:
              $ref: '#/components/headers/Allow'
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIError'
          x-kelvran-method-not-allowed:
            status: 405
            allow: GET
            content_type: application/json; charset=utf-8
            body: openai-envelope
  /healthz:
    get:
      operationId: getHealthz
      tags:
      - Health
      summary: Liveness.
      security: []
      responses:
        '200':
          description: Always `{"status":"ok"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
              examples:
                ok:
                  summary: The only body
                  value:
                    status: ok
                  x-kelvran-example-source: hand-authored
        '405':
          description: 'Any method but GET: `http.Error` plain text, no `Allow`.'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
          x-kelvran-method-not-allowed:
            status: 405
            allow: null
            content_type: text/plain; charset=utf-8
            body: text
  /readyz:
    get:
      operationId: getReadyz
      tags:
      - Health
      summary: 'Readiness: every canonical model has a healthy deployment.'
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
              examples:
                ready:
                  summary: Every canonical model has a healthy deployment
                  value:
                    ready: true
                    models:
                      gpt-4o: true
                      claude-sys: true
                  x-kelvran-example-source: hand-authored
        '405':
          description: 'Any method but GET: `http.Error` plain text, no `Allow`.'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
          x-kelvran-method-not-allowed:
            status: 405
            allow: null
            content_type: text/plain; charset=utf-8
            body: text
        '500':
          description: Marshalling failed (practically unreachable).
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/X-Content-Type-Options'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainTextError'
        '503':
          description: 'Not ready; the same body with `ready: false`. No `Retry-After`.'
          x-kelvran-codes: []
          x-kelvran-retry-after: []
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyzResponse'
  /api/hello:
    head:
      operationId: probeHello
      tags:
      - Health
      summary: 'Claude Code''s gateway probe: a 2xx tells it to send its hint headers.'
      security: []
      responses:
        '204':
          description: No body, no credential read.
        '405':
          description: 'Any method but HEAD: the route''s own OpenAI envelope with `Allow`.'
          x-kelvran-codes:
          - method_not_allowed
          x-kelvran-retry-after: []
          headers:
            Allow:
              $ref: '#/components/headers/Allow'
            X-Content-Type-Options:
