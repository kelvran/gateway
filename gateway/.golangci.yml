# golangci-lint v2 configuration for gateway/.
#
# Tuned to this package's actual conventions, per AGENTS.md's Conventions
# section for gateway/:
#   - errors are wrapped with context (fmt.Errorf("...: %w", err)), never
#     swallowed -> errcheck (unchecked errors) + errorlint (catches error
#     comparisons/wrapping that break errors.Is/As, e.g. a bare "%v"
#     where "%w" was meant, or a non-wrapping == comparison against a
#     sentinel error) enforce this mechanically.
#   - context.Context is the first parameter on anything that can block
#     or needs request-scoped values -> govet's own analyzers already
#     flag the most common mistakes here (e.g. context misuse via the
#     standard "context" vet pass); a dedicated context-argument-order
#     linter was considered but deliberately left out of this minimal
#     config to avoid pulling in a large, noisy default rule set for one
#     narrow convention — see the exclusions note below for how the one
#     genuinely intentional deviation from "always check errors"
#     (the hand-rolled YAML parser's ignored getX ok-booleans, which are
#     validated by explicit required-field checks immediately after) is
#     handled instead.
version: "2"

run:
  timeout: 5m

# Real gotcha, hit live while adding gosec/bodyclose: golangci-lint's
# default max-same-issues (3) silently truncates repeated findings of
# the same rule+message, so fixing the first 3 shown just reveals the
# next 3 on the following run rather than surfacing the true total.
# Uncapped here so every real occurrence is visible in one pass.
issues:
  max-same-issues: 0

linters:
  # errcheck, govet, staticcheck, ineffassign, and unused are
  # golangci-lint v2's own default-enabled set — this section makes that
  # explicit (rather than relying on an implicit default) so the
  # intended linter set is legible from this file alone.
  #
  # Note on "gosimple": in golangci-lint v2, gosimple's checks (the
  # "S1xxx" rules) were folded into staticcheck rather than shipping as a
  # separate linter — enabling staticcheck below is what covers
  # gosimple's checks now; there is no standalone "gosimple" linter to
  # enable in this version.
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    # errorlint directly enforces AGENTS.md's "%w" error-wrapping
    # convention: it flags fmt.Errorf calls that should use %w instead of
    # %v/%s when wrapping an error, and comparisons/switches on error
    # values that would break errors.Is/errors.As.
    - errorlint
    # gosec: code-level static+taint security analysis (SQL/command
    # injection, SSRF, hardcoded credentials, weak crypto/TLS) -- a
    # different mechanism from govulncheck, which only flags known-CVE
    # dependency functions and can never catch a pattern in gateway's
    # own source. Bundled in golangci-lint already, no new dependency.
    - gosec
    # bodyclose: gateway's literal job is proxying HTTP calls to model
    # providers (cmd/gateway/main.go, internal/guardrail/bedrockguard,
    # internal/gateway/dataplane) -- an unclosed response body here is a
    # real connection-pool-exhaustion risk, not a theoretical one.
    - bodyclose
  settings:
    staticcheck:
      checks:
        - all
  exclusions:
    rules:
      # config.go's parseYAMLMini/getString/getFloat/getMap helpers
      # return an "ok" bool specifically so Load's caller-side code can
      # apply its own required-vs-optional-field logic (see Load's
      # explicit "missing required field" checks immediately after each
      # getString/getMap call). Ignoring that ok in a few optional-field
      # call sites (e.g. price_table's per-field getFloat) is the
      # documented, intentional behavior described in config.go's own
      # comments, not an oversight — narrowly suppressed here rather than
      # disabling errcheck package-wide.
      - path: internal/gateway/controlplane/config.go
        linters:
          - errcheck
        text: "Error return value of `.*\\.getString|.*\\.getFloat|.*\\.getMap` is not checked"
      # config.go's Load reads the operator-supplied `-config` flag path
      # (a local file this process's own operator controls, never
      # attacker-reachable input) -- gosec's G304 can't distinguish that
      # from a genuinely tainted path.
      - path: internal/gateway/controlplane/config.go
        linters:
          - gosec
        text: "G304"
      # Test-fixture loaders reading a hardcoded "testdata/" prefix plus
      # a test-controlled fixture name -- never external/attacker input.
      # Every provider adapter package (anthropic/bedrock/gemini/openai/
      # openaicompat) has this identical pattern in its own
      # regression_test.go/stream_test.go, per docs/testing/TESTING.md
      # §4's fixture-based testing convention.
      - path: internal/adapter/.*_test\.go
        linters:
          - gosec
        text: "G304"
      # Both loops' own bounds already prove the index is safe (an
      # equal-length check immediately before the loop in one case, a
      # `stage > 0` guard derived from ranging over the same slice in
      # the other) -- gosec's G602 can't trace either invariant.
      - path: internal/adapter/openaicompat/openaicompat_test\.go
        linters:
          - gosec
        text: "G602"
      - path: internal/router/recovery_ramp_test\.go
        linters:
          - gosec
        text: "G602"
      # OTel GenAI semantic-convention attribute *names* (string
      # constants like "gen_ai.usage.input_tokens") -- not credential
      # values. gosec's G101 heuristic matches on the surrounding
      # "Attr... = ..." shape, not the actual string content.
      - path: internal/telemetry/result\.go
        linters:
          - gosec
        text: "G101"
      # G101 in _test.go files, repo-wide: this is a gateway whose own
      # job is authenticating callers via virtual keys/bearer
      # tokens/API secrets, so its test suite necessarily assigns many
      # obviously-fake secret-shaped literals ("test-secret-a",
      # "per-model-test-value", etc.) to identifiers gosec's naming
      # heuristic flags regardless of content. The real risk G101
      # exists to catch -- an actual credential hardcoded into SHIPPED
      # code -- doesn't apply to test fixtures; narrowly scoped to
      # _test.go rather than disabling G101 package-wide, so a real
      # hardcoded-credential mistake in production code would still be
      # caught.
      - path: _test\.go
        linters:
          - gosec
        text: "G101"
      # math/rand for retry-backoff jitter timing is intentional --
      # this is scheduling randomness, not security-sensitive material
      # (a token, key, or nonce), so crypto/rand would be the wrong
      # choice here, not a hardening improvement.
      - path: internal/gateway/dataplane/fallback\.go
        linters:
          - gosec
        text: "G404"
      # The response is genuinely closed via defer once received off
      # respCh a few lines later in the same test -- bodyclose's
      # flow analysis doesn't follow a *http.Response handed across a
      # channel into a different scope.
      - path: cmd/gateway/graceful_shutdown_integration_test\.go
        linters:
          - bodyclose
      # G302 is written for FILE permission bits (0600 or less) --
      # these two os.Chmod calls target a DIRECTORY (deliberately made
      # read-only, then restored, to prove the admin backup route's own
      # 500 path against a real unwritable BackupDir), where an execute
      # bit is required for traversal and 0600 would make the directory
      # itself inaccessible, not just its contents unwritable. gosec's
      # rule can't distinguish a directory mode from a file mode.
      - path: internal/admin/admin_test\.go
        linters:
          - gosec
        text: "G302"
      # Every exec.Command call here targets a binary this SAME test just
      # built (go build's own -o output path, a fixed test-controlled
      # arg0) or the fixed "go" toolchain -- never attacker-reachable
      # input, unlike the untrusted-argv shape G204 exists to catch.
      - path: cmd/gateway/graceful_shutdown_second_signal_test\.go
        linters:
          - gosec
        text: "G204"
      # stickyWeight/ms.sumW are both sums of weightedDeployment.weight,
      # itself normalized to >=1 in newModelState (wrr.go) -- never
      # negative, so this int->uint64 conversion can't actually
      # underflow/overflow the way G115 is written to catch.
      - path: internal/router/sticky\.go
        linters:
          - gosec
        text: "G115"
      # permutationCoefficientA's own i parameter is always a `range sig`
      # index (sig a fixed-length slice built via make([]uint64, n)) at
      # its one real call site (MinHashSignature) -- structurally never
      # negative, so this int->uint64 conversion can't actually
      # underflow/overflow the way G115 is written to catch. Only started
      # firing once this expression was hoisted out of MinHashSignature's
      # own loop into its own named function (2026-09-20) -- gosec's
      # static analysis apparently judged the inlined form provably safe
      # but not this standalone one, even though the value is identical
      # either way.
      - path: internal/cache/lexical\.go
        linters:
          - gosec
        text: "G115"
      # Retry-backoff jitter timing, never a security-sensitive value
      # (no key/token/ID derives from it, unlike newEventID's own
      # crypto/rand-sourced 16 bytes in this same file) -- math/rand/v2's
      # default source is unpredictable enough for this, and Go 1.22+
      # seeds it from a real CSPRNG anyway; G404 flags the package
      # unconditionally, with no way to distinguish this from an actual
      # security-sensitive use.
      - path: internal/alerting/alerting\.go
        linters:
          - gosec
        text: "G404"
      # containerID is redisContainer.GetContainerID() -- a real Docker
      # container this SAME test created via testcontainers a few lines
      # earlier in TestMain, never attacker-reachable input, the same
      # rationale as graceful_shutdown_second_signal_test.go's identical
      # exclusion above. "docker pause"/"docker unpause" simulate a real
      # network partition against that container to prove Subscribe's
      # own reconnect behavior.
      - path: internal/configpropagation/configpropagation_test\.go
        linters:
          - gosec
        text: "G204"
      # containerID is container.GetContainerID() -- a real Docker
      # container this SAME test created via testcontainers a few lines
      # earlier, never attacker-reachable input, the identical rationale
      # as configpropagation_test.go's exclusion just above. "docker
      # pause"/"docker unpause" simulate a real network partition against
      # that container to prove the active-health-probing circuit breaker
      # both trips and recovers.
      - path: cmd/gateway/chaos_partition_test\.go
        linters:
          - gosec
        text: "G204"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kelvran/gateway
