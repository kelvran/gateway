# Kelvran's own override of grafana/otel-lgtm's REAL, actually-loaded
# Prometheus config (/otel-lgtm/prometheus.yaml -- confirmed via a live
# container's own --config.file flag and direct file inspection,
# 2026-09-15; NOT the decoy classic-format /otel-lgtm/prometheus/
# prometheus.yml the image also happens to ship but never references).
# Byte-identical to the image's own original content except the
# `rule_files:` key added at the bottom, which did not exist at all
# before this file -- adds MWMB SLO alerting per
# docs/operations/grafana/prometheus/kelvran-slo-rules.yml's own header.
---
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m
rule_files:
  - "/otel-lgtm/prometheus/kelvran-slo-rules.yml"
