// api/gatewayevents/v1/gatewayevents.proto
//
// Per docs/rfcs/2026-09-03-api-gatewayevents-contract.md: the structured
// outcome of one gateway request, joinable to the OTel span that already
// carries gen_ai.*/cost/cache_hit data (see
// docs/rfcs/2026-09-02-otel-tracing-agent-run-id.md) via trace_id/span_id.
// This message never re-encodes anything already real on that span.
syntax = "proto3";

package gatewayevents.v1;

option go_package = "github.com/kelvran/gateway/gateway/api/gatewayevents/v1;gatewayeventsv1";

import "google/protobuf/timestamp.proto";

// One per HandleChatCompletion/HandleChatCompletionStream call.
message GatewayDecisionEvent {
  string trace_id = 1;
  string span_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
  // virtual_key_id is "" if auth itself failed (no key was resolved).
  string virtual_key_id = 4;
  string requested_model = 5;

  // Outcome is derived from the same sentinel errors
  // internal/gateway/dataplane already returns — no new rejection
  // categories invented beyond what the code already distinguishes.
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_OK = 1;
    OUTCOME_AUTH_FAILED = 2;
    OUTCOME_MODEL_NOT_ALLOWED = 3;
    OUTCOME_RATE_LIMITED = 4;
    OUTCOME_BUDGET_EXCEEDED = 5;
    OUTCOME_NO_DEPLOYMENT = 6;
    OUTCOME_UPSTREAM_ERROR = 7;
    // Per docs/rfcs/2026-09-03-guardrails-pii-regex-classifier.md: a
    // pre-call or post-call guardrail Block-tier verdict rejected this
    // request. Distinct from OUTCOME_UPSTREAM_ERROR so a guardrail
    // rejection is never misclassified as an upstream failure.
    OUTCOME_GUARDRAIL_BLOCKED = 8;
    // Per docs/upgrade-research/gateway-per-deployment-concurrency-
    // 2026-09-09.md: a deployment-scoped rate-limit or concurrency
    // ceiling rejected this request (dataplane.DeploymentCapacityError) —
    // a backend-capacity condition, distinct from OUTCOME_RATE_LIMITED
    // (which covers the caller's OWN per-key rate limit/concurrency cap)
    // and from the generic OUTCOME_UPSTREAM_ERROR bucket this value was
    // originally folded into before this enum value existed.
    OUTCOME_DEPLOYMENT_CAPACITY = 9;
  }
  Outcome outcome = 6;

  // True iff the rate limiter's backend errored for this request and the
  // request was allowed through anyway (fail-open), per
  // docs/rfcs/2026-09-03-distributed-rate-limiting.md's "Fail-open, not
  // fail-closed" section. false covers BOTH "rate limiter ran and did not
  // fail open" and "rate limiter never ran for this request" (an Outcome of
  // OUTCOME_AUTH_FAILED/OUTCOME_MODEL_NOT_ALLOWED means the request never
  // reached the rate-limit check at all) — those two are intentionally not
  // distinguished; cross-reference Outcome for that.
  bool rate_limit_fail_open = 7;

  // fallback_happened, fallback_from_deployment, and fallback_reason
  // together describe whether this request fell back away from its
  // originally-selected deployment. Corrected 2026-09-11 (comment-only,
  // no wire/field change): Kelvran's fallback logic can now walk a
  // multi-hop, error-classified chain (Deployment.FallbackChains,
  // gateway/internal/gateway/dataplane/fallback.go's attemptFallbackChain)
  // -- this is deliberately STILL a fixed 3-field record, not a
  // repeated/list shape, on purpose: from/reason always capture the
  // FIRST (originally abandoned) deployment/error, never an intermediate
  // hop in a longer chain. The deployment that ULTIMATELY served the
  // request is not repeated here either way -- it's already derivable
  // from the OTel span's DeploymentName/Provider attributes.
  bool fallback_happened = 8;
  // Name of the deployment first tried and abandoned. "" when
  // fallback_happened is false. The deployment ULTIMATELY used is not
  // repeated here — it's already derivable from the OTel span's
  // DeploymentName/Provider attributes, joinable via trace_id/span_id, per
  // this message's own "never re-encodes anything already real on that
  // span" rule.
  string fallback_from_deployment = 9;
  // The first attempt's error (err.Error()). "" when fallback_happened is
  // false. Free text, not an enum — unlike Outcome, these are arbitrary
  // upstream/provider failures with no existing sentinel-error taxonomy.
  string fallback_reason = 10;

  // Cumulative USD spend for virtual_key_id at the moment the budget check
  // decided whether to allow this request — i.e. BEFORE this request's own
  // cost (if any) is added. Decimal-as-string, matching
  // docs/rfcs/2026-09-02-decimal-cost-accounting.md's convention. "0" is a
  // real, meaningful value (a key that has genuinely spent nothing yet),
  // not a "field absent" sentinel — only meaningful when the budget check
  // actually ran; cross-reference Outcome (OUTCOME_AUTH_FAILED/
  // OUTCOME_MODEL_NOT_ALLOWED/OUTCOME_RATE_LIMITED all precede the budget
  // check and never populate this field).
  string budget_spent_usd = 11;

  // Added 2026-09-12, per docs/rfcs/2026-09-12-gateway-cost-attribution-
  // aggregation.md: THIS request's own agent_run_id (from
  // telemetry.AgentRunIDFromContext, the same W3C-Baggage-propagated
  // value already on the OTel span's kelvran.agent_run_id attribute) and
  // real cost (Decimal-as-string, same convention as budget_spent_usd
  // above — the same value telemetry.ChatCompletionResult.CostUSD
  // already carries). Both additive fields, non-breaking per `buf
  // breaking` — this message's own package/directory version (v1)
  // stays frozen. "" for agent_run_id means no baggage value was
  // propagated for this request (the common case until a caller
  // actually sets one); "0" for cost_usd is a real, meaningful value
  // (e.g. a cache hit that was never billed), never a "field absent"
  // sentinel, mirroring budget_spent_usd's own convention. Closes the
  // real gap named in THREAT_MODEL.md's Gateway Repudiation row: the
  // primitive (agent_run_id co-occurring with cost) previously existed
  // only on the ephemeral per-request OTel span, never on the one
  // contract built for offline/cross-request analysis.
  //
  // Corrected 2026-09-12 (comment-only, no wire/field change): the "0"
  // for cost_usd example above ("e.g. a cache hit that was never
  // billed") is inaccurate — a cache hit's resp.Usage survives the
  // cache round-trip intact, so cost_usd on a hit is the nonzero
  // notional would-have-cost, never "0". See savings_usd below, which
  // is the field that actually carries that notional-savings figure.
  string agent_run_id = 12;
  string cost_usd = 13;

  // Added 2026-09-12, per docs/rfcs/2026-09-12-gateway-cache-savings-
  // agent-attribution.md: the notional USD amount THIS request saved by
  // being served from cache instead of a real upstream call -- the exact
  // same value dataplane.finalize already computes and hands to
  // telemetry.RecordCacheSavings (kelvran.cache.savings_usd) on every
  // real hit, now also named on the one contract built for durable,
  // offline analysis, per this message's own "never re-encodes anything
  // already real on that span" rule (that OTel counter is aggregate-only
  // -- dimensioned by cache layer, never by agent_run_id, for the same
  // cardinality reason cost_usd's own sibling RFC rejected an
  // agent_run_id metric dimension -- so this field is the first place
  // the per-agent-run savings figure exists at all). Decimal-as-string,
  // same convention as cost_usd/budget_spent_usd above. "" (the proto3
  // default) on every non-hit row -- deliberately NOT "0" the way
  // cost_usd's own convention reads, because a request that was never a
  // cache hit has no savings figure to report at all, real or zero; a
  // future consumer must not read "" as "zero savings confirmed" the way
  // it may read cost_usd's own "0" that way. Additive field, non-breaking
  // per `buf breaking` -- this message's own package/directory version
  // (v1) stays frozen, same precedent as agent_run_id/cost_usd above.
  // Closes the SAVINGS half of PRD.md's Success Metrics: "Cost savings
  // attributable and explainable down to the individual agent run, not
  // just an aggregate dashboard total" (PRD.md:41) -- the SPEND half was
  // already closed by agent_run_id/cost_usd above.
  string savings_usd = 14;
}
