# Local/dev bring-up for the `gateway` deployable, per
# docs/operations/DEPLOY.md's "Docker Compose (Local/Dev)" section.
#
# `evals` is not a Compose service here — it's a Click CLI, not a
# long-running process, and has no Dockerfile; `docker compose up`
# semantics don't fit a one-shot CLI tool. Run it directly:
#   cd evals && uv run evals --help
#
# No `postgres` service: nothing in `gateway/` touches Postgres today —
# it's a `gateway/ARCHITECTURE.md` Tech Stack *future target* for the
# control-plane config store, not real yet (config is static YAML,
# loaded once at startup — see gateway/ARCHITECTURE.md's `/internal/admin`
# entry).

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      # Bound to loopback only, not 0.0.0.0 — gateway has real bearer-
      # token auth (virtual keys), but there's no reason a local-dev
      # bring-up should default to being reachable from other machines
      # on the network. Change to "8080:8080" locally if you genuinely
      # need LAN access (e.g. testing from another device).
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # Only takes effect once config.yaml's telemetry.exporter: "otlp"
      # points at the observability service (profile-gated below) --
      # otlptracehttp/otlpmetrichttp default to HTTPS otherwise and every
      # export to that plain-HTTP OTLP receiver would fail. Harmless
      # no-op under the "stdout"/"none" exporters this repo still
      # defaults to.
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    volumes:
      # Copy gateway/config.example.yaml -> gateway/config.yaml and fill
      # in real values first — config.yaml is gitignored on purpose (see
      # .gitignore), never committed.
      - ./gateway/config.yaml:/config.yaml:ro
    # No depends_on by default: a bare config.yaml with no rate_limit:
    # section runs gateway fully in-memory, needing neither service below.

  redis:
    image: redis:7-alpine
    # Deliberately no `ports:` — redis:7-alpine has no authentication
    # configured (no requirepass/ACL) and Compose's default port
    # publishing binds to 0.0.0.0, which would make an unauthenticated
    # Redis reachable from any network interface, not just this host.
    # gateway reaches it over the internal Compose network at
    # "redis:6379" (no host port needed for that — only the service
    # name has to resolve, and it does, by default, with zero
    # additional config). Only useful once config.yaml sets
    # rate_limit.redis_addr: redis:6379
    # (gateway/internal/gateway/controlplane/config.go's RateLimitConfig)
    # — per docs/rfcs/2026-09-03-distributed-rate-limiting.md. Started only
    # with `docker compose --profile redis up`, never by a bare `up`.
    profiles: ["redis"]

  # Optional: a second gateway instance sharing the same Redis, letting an
  # operator reproduce a real multi-instance deployment locally -- the
  # exact precondition docs/rfcs/2026-09-03-distributed-rate-limiting.md
  # and docs/rfcs/2026-09-11-gateway-redis-backed-cache-design.md both
  # need before either can be tested against real cross-instance
  # traffic, rather than reasoned about in the abstract. Requires the
  # redis profile too, and config.yaml's rate_limit.redis_addr pointed at
  # "redis:6379" (see that service's own comment above) for distributed
  # rate-limiting to actually engage across both instances. Gated behind
  # its own profile since ordinary local dev needs exactly one instance.
  # Never started by a bare `docker compose up`; only via
  # `docker compose --profile multi-instance --profile redis up`.
  gateway2:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8091:8080"
    env_file:
      - .env
    environment:
      # See gateway's own identical env var above -- same OTLP-over-HTTP
      # TLS-default gotcha applies to this instance too, since it mounts
      # the same config.yaml.
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    volumes:
      - ./gateway/config.yaml:/config.yaml:ro
    profiles: ["multi-instance"]

  # Optional: ships gatewayevents_v1 to S3 for evals' `ingest` command, per
  # docs/rfcs/2026-09-07-evals-trace-ingestion-object-storage.md and
  # docs/operations/vector-gatewayevents-s3-compose.yaml (the actual
  # shipper config this mounts). Gated behind a profile for the same
  # reason `redis` above is: most local dev doesn't need this, and unlike
  # redis, this one genuinely cannot function without external setup
  # that doesn't exist yet -- a real S3 bucket and a real, minimally-
  # scoped IAM credential (see that RFC / docs/operations/ for exactly
  # what's missing). Never started by a bare `docker compose up`; only
  # via `docker compose --profile vector-s3 up`. Profile deliberately
  # named `vector-s3`, not just `vector`, so a future GCS-sibling Compose
  # service (mirroring docs/operations/vector-gatewayevents-gcs.yaml) can
  # get its own `vector-gcs` profile without risk of both ever being
  # enabled together -- that GCS file's own header already warns running
  # both shippers at once would double-ship every event.
  vector:
    image: timberio/vector:0.58.0-debian
    volumes:
      - ./docs/operations/vector-gatewayevents-s3-compose.yaml:/etc/vector/vector.yaml:ro
      # Read-only bind-mount of the host's Docker socket -- required by
      # the docker_logs source to list/tail other containers' logs via
      # the Docker Engine API (never gateway's own request-serving code
      # path). The official image's own Dockerfile sets no USER, so it
      # runs as root and needs no extra `group_add`/`user:` override to
      # read this socket. The socket path can differ per host setup --
      # verify /var/run/docker.sock actually resolves on your own machine
      # before relying on this mount.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Named volume for Vector's own on-disk state (buffers/checkpoints)
      # -- not strictly required by docker_logs the way it is for a
      # file-tailing source, but kept so a container restart doesn't
      # silently drop in-flight buffered data.
      - vector-data:/var/lib/vector
    env_file:
      # Deliberately its own file, not the same .env gateway reads from
      # (env_file: - .env, above) -- a blast-radius reduction, per
      # DECISIONS.md's 2026-09-13 entry recording a real secret
      # (the pilot's AWS access key) accidentally exposed into this
      # session's own transcript via an unredacted `docker compose
      # config` dump. Create .env.vector yourself; it is already covered
      # by .gitignore's `.env.*` pattern, same as .env itself -- never
      # commit it. Must define:
      #   KELVRAN_GATEWAYEVENTS_BUCKET=<real bucket name -- does not
      #     exist yet, see docs/operations/vector-gatewayevents-s3-compose.yaml>
      #   AWS_REGION=<region the bucket lives in>
      #   AWS_ACCESS_KEY_ID=<Vector's own write-only credential -- do
      #     NOT reuse evals' Bedrock-judge credential or this session's
      #     Bedrock-invoke-only credential; neither has S3 permissions
      #     and neither should be widened just to get them>
      #   AWS_SECRET_ACCESS_KEY=<matching secret>
      #   # AWS_SESSION_TOKEN=   # optional, only for temporary/STS creds
      - .env.vector
    depends_on:
      - gateway
    profiles: ["vector-s3"]

  # Optional: a real OTLP observability backend for the pilot, per
  # docs/rfcs/2026-09-02-otel-tracing-agent-run-id.md's own exporter
  # design -- gateway/internal/telemetry/telemetry.go's "otlp" exporter
  # path (otlptracehttp + otlpmetrichttp) has been real, working code
  # since that RFC shipped; the only reason it stayed inactive is that no
  # collector existed to point it at (config.yaml's own telemetry.exporter
  # comment said exactly that). grafana/otel-lgtm bundles the OTel
  # Collector, Prometheus, Tempo, Loki, and Grafana in one image -- the
  # lowest-friction real backend for this pilot's actual current scale
  # (single-tenant, low volume); its own README scopes it to dev/demo/
  # test, which is a genuine match for that stage, not a mismatch. Ports:
  # 4317 (OTLP gRPC, unused by gateway today -- both otlptracehttp and
  # otlpmetrichttp are HTTP exporters), 4318 (OTLP HTTP -- the real
  # endpoint gateway's exporters send to), 3000 (Grafana UI, for local
  # verification only), 9090 (Prometheus, queried directly to confirm
  # real data arrived, e.g. `curl localhost:9090/api/v1/query?query=...`),
  # 3200 (Tempo, for a real-trace API check the same way). All bound to
  # loopback only, same posture as `gateway` above. Gated behind its own
  # profile, same pattern as `redis`/`vector` -- never started by a bare
  # `docker compose up`; only via `docker compose --profile observability
  # up`.
  #
  # gateway/gateway2 need config.yaml's telemetry.exporter: "otlp" and
  # otlp_endpoint: "observability:4318" (only reachable once this
  # container is up) PLUS an OTEL_EXPORTER_OTLP_INSECURE=true env var --
  # a real, verified gotcha: otlptracehttp/otlpmetrichttp default to
  # HTTPS (getScheme() returns "https" unless Insecure is set, confirmed
  # directly against go.opentelemetry.io/otel/exporters/otlp/otlptrace/
  # otlptracehttp@v1.46.0's client.go/otlpconfig), and this collector's
  # OTLP HTTP receiver is plain HTTP, no TLS -- without this env var every
  # export silently fails with a TLS handshake error.
  observability:
    image: grafana/otel-lgtm:0.33.0
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:3200:3200"
    volumes:
      # Real Grafana file-based dashboard provisioning, per
      # docs/operations/grafana/provisioning/dashboards.yaml's own header
      # -- adds one more provider alongside otel-lgtm's own pre-shipped
      # RED/JVM example dashboards (grafana-dashboards.yaml in the same
      # container directory) rather than replacing that file, since
      # Grafana's dashboard provisioner loads every *.yaml in this
      # directory, not just one.
      - ./docs/operations/grafana/provisioning/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/kelvran-dashboards.yaml:ro
      - ./docs/operations/grafana/dashboards/kelvran-overview.json:/otel-lgtm/kelvran-overview.json:ro
    profiles: ["observability"]

volumes:
  vector-data:
