# Dependabot config, per docs/upgrade-research/cicd-process-automation-2026-09-13.md
# Finding 6 -- modeled directly on envoyproxy/ai-gateway's own real config
# (the closest structural analog: a Go-based "gateway" project), not a
# generic template. Renovate was considered and deferred (not_yet, same
# research) -- Dependabot's zero-install footprint is the more
# proportionate starting point for a single-maintainer repo.
#
# Every ecosystem is grouped into a single wildcard-pattern PR (not one
# PR per dependency) and delayed by a 14-day cooldown, so a newly-
# released dependency doesn't trigger a same-day, Bedrock-spend-incurring
# CI run before the wider community has had a chance to flag problems
# with it -- this repo's CI runs real AWS Bedrock calls, not free.
version: 2
updates:
  # go.opentelemetry.io/otel/exporters/prometheus is pinned to the OTel SDK
  # line (the comment on its gateway/go.mod require line; RFC-4, owner gate
  # G25): a grouped update that moves it past v0.68.0 must move the SDK with
  # it or be declined.
  - package-ecosystem: "gomod"
    directory: "/gateway"
    schedule:
      interval: "weekly"
    groups:
      gomod-deps:
        patterns: ["*"]
    cooldown:
      default-days: 14

  # evals is a uv project (evals/pyproject.toml + evals/uv.lock, no
  # requirements file), so it takes the dedicated `uv` ecosystem like
  # gateway/compat/python below: `pip` would rewrite the pyproject ranges and
  # leave the lock -- the file CI installs from (`uv sync`) -- untouched
  # (changed 2026-10-12; the group keeps its name for continuity, no evals PR
  # was open at the time).
  - package-ecosystem: "uv"
    directory: "/evals"
    schedule:
      interval: "weekly"
    groups:
      pip-deps:
        patterns: ["*"]
    cooldown:
      default-days: 14

  # The compatibility matrix (gateway/compat, RFC-1 §11, item 11 slice S12) is
  # its own Go module and its own uv project, so the SDKs and the OpenAPI
  # validator (libopenapi, item 14 slice S5) it pins -- the test dependencies
  # that must never enter gateway/go.mod -- get their own updates.
  # The Python leg uses the dedicated `uv` ecosystem (a uv.lock project; the
  # Dependabot options reference lists it beside pip, read 2026-10-11), not
  # `pip`, whose updates rewrite pyproject ranges rather than the lock.
  - package-ecosystem: "gomod"
    directory: "/gateway/compat"
    schedule:
      interval: "weekly"
    groups:
      compat-gomod-deps:
        patterns: ["*"]
    cooldown:
      default-days: 14
  - package-ecosystem: "uv"
    directory: "/gateway/compat/python"
    schedule:
      interval: "weekly"
    groups:
      compat-pip-deps:
        patterns: ["*"]
    cooldown:
      default-days: 14
  # The nightly TypeScript leg's manifest (.github/compat-ts, item 11 slice S13,
  # ADR 0003 note): @anthropic-ai/sdk and @anthropic-ai/claude-code, pinned.
  - package-ecosystem: "npm"
    directory: "/.github/compat-ts"
    schedule:
      interval: "weekly"
    groups:
      compat-npm-deps:
        patterns: ["*"]
    cooldown:
      default-days: 14
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-deps:
        patterns: ["*"]
    cooldown:
      default-days: 14

  # gateway/Dockerfile pins a real, digest-pinned base image (a
  # golang:<version>-alpine builder stage only -- the final stage is FROM
  # scratch). Without this ecosystem, Dependabot never tracks that pin for
  # version/CVE updates, unlike the gomod/uv/github-actions deps above.
  - package-ecosystem: "docker"
    directory: "/gateway"
    schedule:
      interval: "weekly"
    groups:
      docker-deps:
        patterns: ["*"]
    cooldown:
      default-days: 14
