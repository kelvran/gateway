name: CI

on:
  push:
    branches: [main]
    tags: ["gateway/v*"]
  pull_request:
    branches: [main]

jobs:
  proto:
    name: api (buf lint, breaking, generated-code drift check)
    runs-on: ubuntu-latest
    # Explicit, minimal grant per a live 2026-09-16 adversarial-audit
    # finding: this job never writes anywhere (checkout + buf lint/
    # breaking, all read-only), so the repo's own read-only default
    # (see the evals job's identical comment below) already covered it
    # in practice -- but Scorecard's TokenPermissionsID check (and this
    # repo's own established per-job-explicit convention, not a
    # workflow-level default) wants this stated, not implied.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking's `.git#branch=main` input needs full history,
          # not just the pushed/PR commit — a shallow clone can leave
          # "main" unresolvable or pointed at the wrong commit.
          fetch-depth: 0
      - name: ensure a local main ref exists (buf breaking needs refs/heads/main, not just refs/remotes/origin/main)
        # Real gap, found live: on a branch push to main, checkout's own
        # checked-out ref already IS refs/heads/main, so this is a no-op.
        # On a tag push (e.g. a real gateway/vX.Y.Z release tag), checkout
        # leaves HEAD detached at the tag and only refs/remotes/origin/main
        # exists -- buf's `.git#branch=main` resolver treats this checkout
        # as a git remote and fetches the literal ref name "main", which
        # only refs/heads/* advertises. Idempotent either way.
        # --update-head-ok is required for the branch-push case: without
        # it, git fetch refuses to update refs/heads/main when main is
        # ALSO the currently checked-out branch ("refusing to fetch into
        # current branch"). Safe here -- this only moves the ref pointer,
        # it never touches the working tree, and this job never commits.
        run: git fetch --update-head-ok origin main:refs/heads/main
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
      - name: install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - name: install protoc
        # buf's `protoc_builtin: python` plugin type shells out to a real
        # protoc binary for its bundled generators (unlike protoc-gen-go,
        # a standalone plugin) — ubuntu-latest runners don't ship one.
        # Version-pinned to match local dev exactly (35.1) — `apt-get
        # install protobuf-compiler` was tried first and rejected: it
        # installs whatever protoc version Debian's package repo happens
        # to carry (confirmed empirically: 3.21.12 on ubuntu-24.04),
        # which generates structurally different Python code than a
        # matching-version protoc — a real, reproduced `check-proto`
        # false-positive-drift risk, not a hypothetical one.
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: lint + breaking + generated-code drift check
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lint-proto
          make check-proto

  gateway:
    name: gateway (build, vet, lint, test)
    runs-on: ubuntu-latest
    # Explicit, minimal grant — see the proto job's identical comment
    # just above: this job is also entirely read-only (build/vet/lint/
    # test, no writes anywhere).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.8"
          cache-dependency-path: gateway/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: gateway
      - name: go-arch-lint (dependency-direction enforcement)
        working-directory: gateway
        run: go run github.com/fe3dback/go-arch-lint@v1.18.0 check
      - name: govulncheck (dependency CVE scanning)
        working-directory: gateway
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: build + test
        working-directory: gateway
        # -coverprofile/-covermode=atomic/-coverpkg=./... generate a real
        # coverage profile from this same run -- no second test pass, no
        # third-party upload. -covermode=atomic (not the default `set`)
        # is required for a coverage-safe result under `-race`'s
        # concurrent execution; -coverpkg=./... captures coverage
        # attributed across package boundaries, not just within each
        # package's own test file, matching go-test-coverage's own
        # documented recommended invocation.
        run: |
          go build ./...
          go vet ./...
          go test ./... -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out
      - name: go-test-coverage (real same-runner coverage gate, no third-party upload)
        # Rejected Codecov/Coveralls per docs/upgrade-research/cicd-
        # process-automation-2026-09-13.md item 10: uploading a coverage
        # profile to a third-party SaaS enumerates the full source-tree
        # structure to that third party, an unnecessary exposure for a
        # project with real Bedrock spend. go-test-coverage computes and
        # gates entirely from the coverage.out profile generated by the
        # step above, inside this same runner. Source-based variant
        # (`action/source`, not the default prebuilt-Docker-image
        # action) chosen deliberately for auditability -- this repo
        # already runs cosign/SBOM/attestation for its own image, so
        # running an opaque third-party container image here would cut
        # against that same supply-chain posture; the source variant just
        # `go run`s the pinned commit's own code with the Go toolchain
        # already set up above. Threshold + exclude rationale, and the
        # real measured baseline it's set against, are documented in
        # gateway/.testcoverage.yml itself.
        uses: vladopajic/go-test-coverage/action/source@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./gateway/.testcoverage.yml
          profile: gateway/coverage.out

  evals:
    name: evals (sync, ruff, pytest)
    runs-on: ubuntu-latest
    # Repo default is read-only (checked live via `gh api repos/kelvran/
    # gateway/actions/permissions/workflow` -> "default_workflow_permissions":
    # "read") -- python-coverage-comment-action needs write access for two
    # real, narrow reasons: pushing coverage data to its own
    # `python-coverage-comment-action-data` branch on every push to `main`
    # (contents), and posting/updating the coverage comment on a PR
    # (pull-requests). On a fork PR, GitHub downgrades these back to
    # read-only automatically -- see the action's own README -- so this
    # grant never reaches untrusted code.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # python-coverage-comment-action's own README explicitly
          # recommends this: it authenticates its own git operations via
          # the GITHUB_TOKEN input below, not via a persisted credential
          # left sitting in .git/config -- one fewer copy of the token on
          # disk for the rest of this job's steps.
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: ruff
        working-directory: evals
        run: uvx ruff check .
      - name: mypy (incremental per-module strict allowlist)
        # Closes the real AGENTS.md Conventions gap ("type hints on all
        # public functions" was documented but never enforced by CI/lint).
        # Deliberately incremental, per mypy's own docs recommendation --
        # not a big-bang strict pass across all of evals/. pyproject.toml's
        # [tool.mypy] sets a permissive global default (ignore_errors)
        # plus an explicit per-module strict override for the modules
        # verified 2026-09-14 to pass `mypy --strict` for real (see that
        # section's own comment for the measured baseline and the exact
        # module list). `uvx --with-editable .` mirrors import-linter's own
        # invocation style below -- ensures `evals`'s own dependencies
        # (pydantic, etc.) are on the path mypy resolves against.
        working-directory: evals
        run: uvx --with-editable . mypy evals/
      - name: import-linter (layer-contract enforcement)
        working-directory: evals
        run: uvx --with-editable . --from import-linter lint-imports
      - name: pip-audit (dependency CVE scanning)
        working-directory: evals
        # A bare `uvx pip-audit` runs in an isolated ephemeral environment
        # with nothing installed -- it would silently scan zero packages,
        # not evals' real dependencies. `uv run --with` overlays pip-audit
        # onto the project's own (auto-synced) venv so it audits what's
        # actually installed.
        run: uv run --with pip-audit==2.9.0 pip-audit
      - name: sync + test (with coverage instrumentation + real same-runner gate)
        working-directory: evals
        # `--cov-fail-under` is the actual gate: it fails this step's own
        # exit code on every run (push AND pull_request) if total coverage
        # regresses below the threshold -- unlike
        # python-coverage-comment-action below, whose own
        # new_percent_covered/reference_percent_covered outputs are
        # documented as "Only available in PR mode" (confirmed directly
        # against that action's action.yml), so relying on it alone would
        # leave every direct push to `main` -- this repo's real, normal
        # workflow -- completely ungated.
        #
        # Real measured baseline (2026-09-14): `uv run pytest --cov=evals
        # tests/` -> 1648 statements, 83 missed, 94.96% (after
        # [tool.coverage.run]'s `omit = ["evals/contracts/*"]` excludes
        # the generated protobuf module, mirroring [tool.ruff]'s own
        # extend-exclude for the same file). Sanity-checked directly, not
        # assumed: the same command with --cov-fail-under=99 fails
        # ("Required test coverage of 99% not reached. Total coverage:
        # 94.96%"); with --cov-fail-under=93 it passes. 93 is set at a
        # small, disclosed margin below the real 94.96% baseline -- never
        # a guessed round number, never chasing 100% -- so a genuine
        # regression trips this gate.
        run: |
          uv sync
          uv run pytest --cov=evals --cov-report=term-missing --cov-fail-under=93 tests/
      - name: evals coverage comment/badge (python-coverage-comment-action)
        # Rejected Codecov/Coveralls for the same reason as gateway's
        # go-test-coverage step above (docs/upgrade-research/cicd-
        # process-automation-2026-09-13.md item 10) -- this action reads
        # only the local `.coverage` file the step above already
        # produced, inside this same runner, and never uploads it
        # anywhere outside GitHub's own infrastructure. COVERAGE_PATH is
        # `evals` because `.coverage` lives at `evals/.coverage`, not the
        # repo root this action defaults to.
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERAGE_PATH: evals
      - name: enforce evals coverage threshold from python-coverage-comment-action's own output
        # CRITICAL implementation detail (docs/upgrade-research/cicd-
        # process-automation-2026-09-13.md item 11): this action does NOT
        # natively fail a build on a threshold by itself -- it only
        # exposes numeric outputs (new_percent_covered,
        # reference_percent_covered); the calling workflow must wire them
        # into its own conditional step with an explicit `exit 1` to
        # actually gate, not just comment/badge. This step is that
        # wiring. `new_percent_covered` only exists in PR mode (per the
        # action's own action.yml), so this step is a no-op on a direct
        # push to `main` -- the step above's `--cov-fail-under=93` is the
        # gate that covers that case; this step adds a second, PR-review-
        # visible enforcement of the exact number shown in the coverage
        # comment, using the same 93% threshold for consistency.
        if: steps.coverage_comment.outputs.new_percent_covered != ''
        env:
          NEW_PERCENT_COVERED: ${{ steps.coverage_comment.outputs.new_percent_covered }}
        run: |
          python3 -c "
          import os, sys
          pct = float(os.environ['NEW_PERCENT_COVERED'])
          # Real bug, found live 2026-09-17: python-coverage-comment-action's
          # own new_percent_covered output is a 0.0-1.0 FRACTION (confirmed
          # against a real PR run's own log: 0.9496359223300971 for what the
          # coverage comment itself displayed as 94.96%), not a 0-100
          # percentage -- comparing it against 93.0 made this step fail
          # unconditionally, on every PR, regardless of real coverage. Both
          # of this repo's only 2 open PRs (Dependabot #1, #2) were blocked
          # by this before the fix.
          threshold = 0.93
          print(f'python-coverage-comment-action new_percent_covered={pct} vs threshold={threshold}')
          sys.exit(0 if pct >= threshold else 1)
          "
      - name: CI gate smoke test (evals run + report --fail-under/--tier/--category-fail-under)
        # Deliberately narrow scope: proves the `evals run` -> `evals
        # report --fail-under` exit-code plumbing (DECISIONS.md's
        # 2026-09-05 entry: "mechanism exists and is tested, not yet
        # wired into this repo's own CI") actually works end-to-end in a
        # real CI job. This is NOT a real quality bar and NOT a curated
        # regression dataset — building one is separate, unscoped future
        # work; this step's only job is proving the CI wiring itself
        # doesn't rot.
        #
        # Extended 2026-09-07 (docs/rfcs/2026-09-07-evals-cigate-
        # refinements.md) to dogfood the tier default, category gate, and
        # flaky exclusion together, not just the bare --fail-under flag.
        # tests/fixtures/ci_gate_example.json has 4 tier="regression"
        # cases (2 plain PASS, 1 tagged category:safety and PASS, 1
        # flaky=true and deliberately WRONG) plus 1 tier="golden" case,
        # also deliberately WRONG, that --tier regression must exclude
        # entirely. Computed directly via evals.stats.wilson_interval,
        # not guessed:
        #   - If EITHER --tier or flaky exclusion were silently broken,
        #     the eligible set collapses to 3 successes / 4 trials ->
        #     Wilson lower bound 0.3006.
        #   - With both correctly applied: 3 successes / 3 eligible
        #     trials -> Wilson lower bound 0.4385.
        #   --fail-under 0.35 sits strictly between those two numbers —
        #   a regression in either mechanism flips this step red.
        #   - The category:safety-tagged case is 1/1 -> Wilson lower
        #     bound 0.2065; --category-fail-under sits below it with
        #     real margin.
        working-directory: evals
        run: |
          uv run evals run --suite tests/fixtures/ci_gate_example.json --scores .ci-smoke-scores.jsonl
          uv run evals report --scores .ci-smoke-scores.jsonl --tier regression --fail-under 0.35 --category-fail-under "category:safety:0.15"
      - name: Real regression corpus gate (113 cases across 5 files)
        # The first REAL quality gate on this repo's own actual regression
        # corpus (tests/fixtures/regression_corpus_{cache_adversarial,
        # cost_abuse,dogfood,guardrail,routing_chaos}.json) — distinct from
        # the smoke test above, which only proves the --fail-under/--tier/
        # --category-fail-under PLUMBING works, against a synthetic 5-case
        # fixture. This step was the one item left open from the older
        # upgrade roadmap after the 2026-09-09 consolidated plan closed —
        # see STATUS.md/DECISIONS.md.
        #
        # Every case in this corpus is deterministic (task_spec.output
        # already baked in, scored via exact-match — no live LLM calls, no
        # network, no AWS credentials needed) and tier="regression",
        # flaky=false (confirmed directly, not assumed, before choosing
        # thresholds) — so, unlike the judge-accuracy corpus's own now-
        # removed nightly gate, there is zero run-to-run sampling noise
        # here: the SAME pass/fail outcome recurs on every CI run until
        # either the code or the corpus itself changes. That means every
        # threshold below can be calibrated tightly, right up against the
        # real measured baseline, with no risk of spurious flakiness.
        #
        # Real baseline, computed 2026-09-09 by actually running the full
        # corpus (not estimated): 97/113 pass (85.84%), Wilson 95% lower
        # bound 0.7823. Several of the 16 real FAILs are deliberate, honest
        # FAIL cases documenting KNOWN, not-yet-fixed gaps (e.g.
        # costabuse-tpm-no-permodel-dimension-crossmodel-fallback-gap) —
        # the goal of this gate is catching a NEW regression (a
        # previously-PASSING case starting to fail), never chasing 100%.
        #
        # Every threshold below (aggregate + one per real category: tag
        # already used across these 5 files) is set at the exact midpoint
        # between today's real Wilson lower bound and the Wilson lower
        # bound ONE MORE case regressing would produce — computed directly
        # via evals.stats.wilson_interval, not guessed — so a single new
        # regression anywhere trips its own category's gate (and, for
        # most categories, the aggregate gate too):
        #   category:cache      13/19 -> 0.4601 | -1 -> 0.4104 | gate 0.43
        #   category:cost       15/17 -> 0.6566 | -1 -> 0.5897 | gate 0.62
        #   category:routing    20/26 -> 0.5795 | -1 -> 0.5392 | gate 0.56
        #   category:streaming    6/6 -> 0.6097 | -1 -> 0.4365 | gate 0.52
        #   category:guardrail  23/25 -> 0.7503 | -1 -> 0.7004 | gate 0.72
        #   category:telemetry    7/7 -> 0.6457 | -1 -> 0.4869 | gate 0.56
        #   category:harness      8/8 -> 0.6756 | -1 -> 0.5291 | gate 0.60
        #   category:judge        5/5 -> 0.5655 | -1 -> 0.3755 | gate 0.47
        #   aggregate           97/113 -> 0.7823 | -1 -> 0.7722 | gate 0.78
        #
        # IMPORTANT for future corpus-growth PRs: adding or fixing cases
        # shifts every number above. Re-run the corpus for real (the 5
        # `evals run` calls below into one --scores file, then `evals
        # report` with the category flags) and recompute each threshold
        # via the same midpoint method BEFORE merging a corpus-growth
        # change — do not silently leave stale thresholds in place, and
        # do not widen a threshold just to make a new PR pass without
        # re-verifying the new baseline is a real, deliberate one.
        working-directory: evals
        run: |
          rm -f .ci-regression-corpus-scores.jsonl
          uv run evals run --suite tests/fixtures/regression_corpus_cache_adversarial.json --scores .ci-regression-corpus-scores.jsonl
          uv run evals run --suite tests/fixtures/regression_corpus_cost_abuse.json --scores .ci-regression-corpus-scores.jsonl
          uv run evals run --suite tests/fixtures/regression_corpus_dogfood.json --scores .ci-regression-corpus-scores.jsonl
          uv run evals run --suite tests/fixtures/regression_corpus_guardrail.json --scores .ci-regression-corpus-scores.jsonl
          uv run evals run --suite tests/fixtures/regression_corpus_routing_chaos.json --scores .ci-regression-corpus-scores.jsonl
          uv run evals report --scores .ci-regression-corpus-scores.jsonl --tier regression \
            --fail-under 0.78 \
            --category-fail-under "category:cache:0.43" \
            --category-fail-under "category:cost:0.62" \
            --category-fail-under "category:routing:0.56" \
            --category-fail-under "category:streaming:0.52" \
            --category-fail-under "category:guardrail:0.72" \
            --category-fail-under "category:telemetry:0.56" \
            --category-fail-under "category:harness:0.60" \
            --category-fail-under "category:judge:0.47"

  # Kelvran's first real artifact-publishing pipeline -- per
  # docs/upgrade-research/supply-chain-security-2026-09-13.md, SBOM
  # generation/cosign signing/SLSA provenance were all correctly deferred
  # specifically because no such pipeline existed to attach them to
  # (DECISIONS.md's same-dated correction entry). This job is that
  # prerequisite: builds gateway/Dockerfile and pushes it to GHCR, using
  # only the repo's own built-in GITHUB_TOKEN -- no new secret, no new
  # external account, since GHCR is already tied to this GitHub org/repo.
  # evals/ has no Dockerfile (it's a CLI, not a service -- confirmed in
  # docker-compose.yml's own comment) so there is nothing to publish for
  # it. push-only (never on a pull_request): a fork PR wouldn't have
  # packages: write, and even a same-repo PR shouldn't publish an image
  # for an unmerged change.
  #
  # SBOM + cosign signing + SLSA provenance (added once this job's own
  # existence closed the prerequisite gap): per that same research's own
  # Findings 1-3, this reaches SLSA Build Level 2 "by default" on
  # GitHub-hosted runners with zero long-lived key management -- cosign's
  # keyless signing exchanges this job's own OIDC token for a short-lived
  # Fulcio cert (Finding 1); Syft-class SBOM generation is a one-step CI
  # operation, CycloneDX format per that research's own tooling-momentum
  # note (Finding 2); `actions/attest-sbom`/`attest-build-provenance` are
  # GitHub's own native, currently-maintained path -- deliberately NOT
  # the deprecated `slsa-github-generator` project (Finding 5's own
  # "avoid this" verdict). All attestations are signed and pushed to the
  # SAME image digest `docker/build-push-action` just produced, not a
  # mutable tag, so they stay bound to the exact artifact built. SLSA
  # Build Level 3 (a reusable-workflow isolation boundary) stays
  # correctly out of scope per that research's own Finding 4 -- no named
  # trigger (external consumer demand, or outside contributors with
  # workflow-file write access) has fired.
  publish-image:
    name: publish gateway image to GHCR
    runs-on: ubuntu-latest
    needs: gateway
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        # Always tag :latest and :sha-<commit>. A real gateway/vX.Y.Z tag
        # push (per RELEASE.md's own Per-Deployable Release Steps) ALSO
        # gets a semver image tag (the "gateway/" prefix stripped, since
        # that prefix exists only to disambiguate from evals' own
        # independently-versioned git tags -- the image itself has no
        # such ambiguity, there being exactly one container Kelvran
        # publishes). A plain push to main (ref_type != tag) never adds
        # a semver tag -- only a real, deliberate release tag does.
        id: tags
        env:
          # Bound via env:, never interpolated directly into the script
          # below -- github.ref_name is attacker-influenceable text (a
          # ref name), and a bare ${{ github.ref_name }} inside `run:`
          # would text-substitute it into the shell source before
          # parsing, a real GitHub Actions script-injection vector. An
          # env var reference is data, never re-parsed as shell syntax.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          TAGS="ghcr.io/kelvran/gateway:latest
          ghcr.io/kelvran/gateway:sha-${SHA}"
          if [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" == gateway/v* ]]; then
            VERSION="${REF_NAME}"
            VERSION="${VERSION#gateway/}"
            TAGS="$TAGS
          ghcr.io/kelvran/gateway:${VERSION}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$TAGS"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push gateway image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./gateway
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published image (keyless, via GitHub OIDC)
        # Keyless signing has been cosign's stable, default mode since
        # v2.0 -- no COSIGN_EXPERIMENTAL flag needed, matching the real
        # current example workflows this session's own research verified
        # (tracelane/tracelane, j-dahl7/container-sbom-signing-attestation).
        run: cosign sign --yes "ghcr.io/kelvran/gateway@${{ steps.build.outputs.digest }}"
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: "ghcr.io/kelvran/gateway@${{ steps.build.outputs.digest }}"
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/kelvran/gateway
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: Attest build provenance (SLSA Build Level 2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/kelvran/gateway
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
