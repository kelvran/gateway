name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  proto:
    name: api (buf lint, breaking, generated-code drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking's `.git#branch=main` input needs full history,
          # not just the pushed/PR commit — a shallow clone can leave
          # "main" unresolvable or pointed at the wrong commit.
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
      - name: install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - name: install protoc
        # buf's `protoc_builtin: python` plugin type shells out to a real
        # protoc binary for its bundled generators (unlike protoc-gen-go,
        # a standalone plugin) — ubuntu-latest runners don't ship one.
        # Version-pinned to match local dev exactly (35.1) — `apt-get
        # install protobuf-compiler` was tried first and rejected: it
        # installs whatever protoc version Debian's package repo happens
        # to carry (confirmed empirically: 3.21.12 on ubuntu-24.04),
        # which generates structurally different Python code than a
        # matching-version protoc — a real, reproduced `check-proto`
        # false-positive-drift risk, not a hypothetical one.
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: lint + breaking + generated-code drift check
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lint-proto
          make check-proto

  gateway:
    name: gateway (build, vet, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
          cache-dependency-path: gateway/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: gateway
      - name: go-arch-lint (dependency-direction enforcement)
        working-directory: gateway
        run: go run github.com/fe3dback/go-arch-lint@v1.18.0 check
      - name: govulncheck (dependency CVE scanning)
        working-directory: gateway
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: build + test
        working-directory: gateway
        run: |
          go build ./...
          go vet ./...
          go test ./... -race

  evals:
    name: evals (sync, ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        working-directory: evals
        run: uvx ruff check .
      - name: import-linter (layer-contract enforcement)
        working-directory: evals
        run: uvx --with-editable . --from import-linter lint-imports
      - name: pip-audit (dependency CVE scanning)
        working-directory: evals
        # A bare `uvx pip-audit` runs in an isolated ephemeral environment
        # with nothing installed -- it would silently scan zero packages,
        # not evals' real dependencies. `uv run --with` overlays pip-audit
        # onto the project's own (auto-synced) venv so it audits what's
        # actually installed.
        run: uv run --with pip-audit==2.9.0 pip-audit
      - name: sync + test
        working-directory: evals
        run: |
          uv sync
          uv run pytest tests/
      - name: CI gate smoke test (evals run + report --fail-under/--tier/--category-fail-under)
        # Deliberately narrow scope: proves the `evals run` -> `evals
        # report --fail-under` exit-code plumbing (DECISIONS.md's
        # 2026-09-05 entry: "mechanism exists and is tested, not yet
        # wired into this repo's own CI") actually works end-to-end in a
        # real CI job. This is NOT a real quality bar and NOT a curated
        # regression dataset — building one is separate, unscoped future
        # work; this step's only job is proving the CI wiring itself
        # doesn't rot.
        #
        # Extended 2026-09-07 (docs/rfcs/2026-09-07-evals-cigate-
        # refinements.md) to dogfood the tier default, category gate, and
        # flaky exclusion together, not just the bare --fail-under flag.
        # tests/fixtures/ci_gate_example.json has 4 tier="regression"
        # cases (2 plain PASS, 1 tagged category:safety and PASS, 1
        # flaky=true and deliberately WRONG) plus 1 tier="golden" case,
        # also deliberately WRONG, that --tier regression must exclude
        # entirely. Computed directly via evals.stats.wilson_interval,
        # not guessed:
        #   - If EITHER --tier or flaky exclusion were silently broken,
        #     the eligible set collapses to 3 successes / 4 trials ->
        #     Wilson lower bound 0.3006.
        #   - With both correctly applied: 3 successes / 3 eligible
        #     trials -> Wilson lower bound 0.4385.
        #   --fail-under 0.35 sits strictly between those two numbers —
        #   a regression in either mechanism flips this step red.
        #   - The category:safety-tagged case is 1/1 -> Wilson lower
        #     bound 0.2065; --category-fail-under sits below it with
        #     real margin.
        working-directory: evals
        run: |
          uv run evals run --suite tests/fixtures/ci_gate_example.json --scores .ci-smoke-scores.jsonl
          uv run evals report --scores .ci-smoke-scores.jsonl --tier regression --fail-under 0.35 --category-fail-under "category:safety:0.15"
      - name: Real regression corpus gate (113 cases across 5 files)
        # The first REAL quality gate on this repo's own actual regression
        # corpus (tests/fixtures/regression_corpus_{cache_adversarial,
        # cost_abuse,dogfood,guardrail,routing_chaos}.json) — distinct from
        # the smoke test above, which only proves the --fail-under/--tier/
        # --category-fail-under PLUMBING works, against a synthetic 5-case
        # fixture. This step was the one item left open from the older
        # upgrade roadmap after the 2026-09-09 consolidated plan closed —
        # see STATUS.md/DECISIONS.md.
        #
        # Every case in this corpus is deterministic (task_spec.output
        # already baked in, scored via exact-match — no live LLM calls, no
        # network, no AWS credentials needed) and tier="regression",
        # flaky=false (confirmed directly, not assumed, before choosing
        # thresholds) — so, unlike the judge-accuracy corpus's own now-
        # removed nightly gate, there is zero run-to-run sampling noise
        # here: the SAME pass/fail outcome recurs on every CI run until
        # either the code or the corpus itself changes. That means every
        # threshold below can be calibrated tightly, right up against the
        # real measured baseline, with no risk of spurious flakiness.
        #
        # Real baseline, computed 2026-09-09 by actually running the full
        # corpus (not estimated): 97/113 pass (85.84%), Wilson 95% lower
        # bound 0.7823. Several of the 16 real FAILs are deliberate, honest
        # FAIL cases documenting KNOWN, not-yet-fixed gaps (e.g.
        # costabuse-tpm-no-permodel-dimension-crossmodel-fallback-gap) —
        # the goal of this gate is catching a NEW regression (a
        # previously-PASSING case starting to fail), never chasing 100%.
        #
        # Every threshold below (aggregate + one per real category: tag
        # already used across these 5 files) is set at the exact midpoint
        # between today's real Wilson lower bound and the Wilson lower
        # bound ONE MORE case regressing would produce — computed directly
        # via evals.stats.wilson_interval, not guessed — so a single new
        # regression anywhere trips its own category's gate (and, for
        # most categories, the aggregate gate too):
        #   category:cache      13/19 -> 0.4601 | -1 -> 0.4104 | gate 0.43
        #   category:cost       15/17 -> 0.6566 | -1 -> 0.5897 | gate 0.62
        #   category:routing    20/26 -> 0.5795 | -1 -> 0.5392 | gate 0.56
        #   category:streaming    6/6 -> 0.6097 | -1 -> 0.4365 | gate 0.52
        #   category:guardrail  23/25 -> 0.7503 | -1 -> 0.7004 | gate 0.72
        #   category:telemetry    7/7 -> 0.6457 | -1 -> 0.4869 | gate 0.56
        #   category:harness      8/8 -> 0.6756 | -1 -> 0.5291 | gate 0.60
        #   category:judge        5/5 -> 0.5655 | -1 -> 0.3755 | gate 0.47
        #   aggregate           97/113 -> 0.7823 | -1 -> 0.7722 | gate 0.78
        #
        # IMPORTANT for future corpus-growth PRs: adding or fixing cases
        # shifts every number above. Re-run the corpus for real (the 5
        # `evals run` calls below into one --scores file, then `evals
        # report` with the category flags) and recompute each threshold
        # via the same midpoint method BEFORE merging a corpus-growth
        # change — do not silently leave stale thresholds in place, and
        # do not widen a threshold just to make a new PR pass without
        # re-verifying the new baseline is a real, deliberate one.
        working-directory: evals
        run: |
          rm -f .ci-regression-corpus-scores.jsonl
          uv run evals run --suite tests/fixtures/regression_corpus_cache_adversarial.json --scores .ci-regression-corpus-scores.jsonl
          uv run evals run --suite tests/fixtures/regression_corpus_cost_abuse.json --scores .ci-regression-corpus-scores.jsonl
          uv run evals run --suite tests/fixtures/regression_corpus_dogfood.json --scores .ci-regression-corpus-scores.jsonl
          uv run evals run --suite tests/fixtures/regression_corpus_guardrail.json --scores .ci-regression-corpus-scores.jsonl
          uv run evals run --suite tests/fixtures/regression_corpus_routing_chaos.json --scores .ci-regression-corpus-scores.jsonl
          uv run evals report --scores .ci-regression-corpus-scores.jsonl --tier regression \
            --fail-under 0.78 \
            --category-fail-under "category:cache:0.43" \
            --category-fail-under "category:cost:0.62" \
            --category-fail-under "category:routing:0.56" \
            --category-fail-under "category:streaming:0.52" \
            --category-fail-under "category:guardrail:0.72" \
            --category-fail-under "category:telemetry:0.56" \
            --category-fail-under "category:harness:0.60" \
            --category-fail-under "category:judge:0.47"
