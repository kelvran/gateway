name: evals judge/panel accuracy (nightly)

# Deliberately separate from ci.yml's per-push evals job, per
# docs/rfcs/2026-09-08-evals-judge-panel-reducer.md's CI-scheduling
# decision: real, unbounded dollar cost against a live paid provider on
# every push/PR update would be a genuine, real cost this repo doesn't
# otherwise carry; no provider call site in evals/evals/judge/providers
# .py sets a temperature parameter, so a judge/panel verdict on an
# identical prompt is genuinely non-deterministic run-to-run at each
# provider's own API default — gating PR mergeability on a probabilistic
# call whose own corpus is deliberately built to include ambiguous
# boundary cases would be a real, self-inflicted CI-flakiness source.
# Nightly + workflow_dispatch gives a real, recurring, unattended,
# live-running gate with zero coupling to PR mergeability.
#
# Both --llm-judge (single judge) and --llm-judge-panel (2-judge panel)
# are entirely AWS Bedrock now -- Claude Haiku 4.5 for the standalone
# judge, Claude Sonnet 5 + Claude Haiku 4.5 for the panel, per that RFC's
# own panel-composition revision (an explicit, accepted same-vendor-
# correlation tradeoff for AWS-only operational simplicity, extended to
# the standalone judge for the same reason: one AWS credential covers
# everything, no separate Anthropic key needed at all). Credentials
# resolve via boto3's standard AWS credential chain, never a Kelvran-
# specific env var name. --llm-judge reuses the exact same Bedrock Haiku
# 4.5 model id as the panel's own Haiku panelist -- a real, deliberate
# choice: it reactivates the cache-key design's cross-mode reuse property
# (a vote cached from one mode is reusable in the other for the same
# model id), which had no real code path while --llm-judge was direct-
# Anthropic and the panel was Bedrock-only.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  judge-accuracy:
    name: evals judge + panel accuracy against the real judge-accuracy corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # judge-accuracy-trend.jsonl carries real TrendSnapshot history
      # ACROSS runs on this ephemeral runner -- per
      # docs/upgrade-research/evals-continuous-monitoring-2026-09-11.md
      # Finding 3, `evals trend alert`'s threshold+window check needs
      # more than one run's worth of data to mean anything.
      # actions/cache, not actions/upload-artifact (this job's own
      # pre-existing scores upload below): artifacts are scoped to the
      # run that created them with no built-in "latest across all past
      # runs" lookup, exactly wrong for a file meant to accumulate
      # indefinitely. actions/cache/restore + a run-id-suffixed save key
      # (below) sidesteps cache keys' own immutability -- restore-keys'
      # prefix match always finds the most recent previous save, and a
      # fresh key every run means this run's save never collides with
      # (or is blocked by) an old one. No error on a cache miss -- that
      # is the normal, expected state on the very first run ever.
      - name: restore prior trend history, if any
        uses: actions/cache/restore@v4
        with:
          path: evals/judge-accuracy-trend.jsonl
          key: judge-accuracy-trend-${{ github.run_id }}
          restore-keys: |
            judge-accuracy-trend-
      - name: judge + panel accuracy run against real AWS Bedrock
        # Deliberately excludes the existing 113-case deterministic
        # regression corpus (regression_corpus_*.json) -- that's
        # separately-tracked work with its own unresolved calibration
        # question (several of those cases are deliberate, honestly-
        # documented FAIL cases), not this workflow's concern.
        # tests/fixtures/regression_corpus_judge_accuracy.json (Phase 4,
        # 24 cases, live-verified 2026-09-08 against the real Bedrock
        # panel) now exists and is real. Both --llm-judge and
        # --llm-judge-panel need only the 3 AWS secrets below -- no
        # separate Anthropic key, since --llm-judge moved to Bedrock too.
        working-directory: evals
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        # No --fail-under/--category-fail-under here, unlike ci.yml's
        # smoke test -- a real dry-run against the live corpus (2026-09-
        # 08) found this corpus's raw pass_rate is NOT a meaningful gate
        # metric: the corpus is deliberately half designed-to-FAIL (8 of
        # 24 cases are wrong outputs a correct judge should reject), so a
        # well-performing judge lands around 40-55% pass_rate, not near
        # 100% -- real runs measured 0.4583 (llm_judge) and 0.4167
        # (llm_judge_panel), both correctly classifying every "obvious"
        # case. The originally-planned --fail-under 0.60 was based on a
        # flawed pre-corpus assumption ("all obvious cases pass" was
        # read as "all 16 obvious cases score PASS," when half of them
        # are designed to score FAIL) and would have failed this job on
        # every single run regardless of judge quality -- caught before
        # ever merging a broken gate, not after. A real gate needs an
        # accuracy-vs-designed-label metric (did the verdict match this
        # corpus's own intended correct/incorrect classification), which
        # `evals report` has no concept of today -- separately-scoped
        # future work, not improvised here. This job stays a real,
        # recurring data-collection run (the uploaded artifact is what
        # Phase 6 analyzes), not a pass/fail gate, until that exists.
        run: |
          uv sync
          uv run evals run --suite tests/fixtures/regression_corpus_judge_accuracy.json \
            --scores judge-accuracy-scores.jsonl --llm-judge
          uv run evals run --suite tests/fixtures/regression_corpus_judge_accuracy.json \
            --scores judge-accuracy-scores.jsonl --llm-judge-panel
          uv run evals report --scores judge-accuracy-scores.jsonl --tier regression \
            --judge-accuracy tests/fixtures/regression_corpus_judge_accuracy.json \
            --record-trend judge-accuracy-trend.jsonl
      - name: upload real scores for later disagreement-rate analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-accuracy-scores-${{ github.run_id }}
          path: evals/judge-accuracy-scores.jsonl
          retention-days: 90
      # Real trend gate, per docs/upgrade-research/evals-continuous-
      # monitoring-2026-09-11.md Finding 3 -- static thresholds are the
      # thresholds every 2026 platform surveyed actually ships. Both
      # bounds are STARTING-POINT values, explicitly not calibrated
      # against real production data yet (see docs/operations/
      # TELEMETRY.md's own "no concrete target numbers yet" stance) --
      # revisit once this corpus's own accuracy-vs-designed-label metric
      # (named as separately-scoped future work above) exists. Never
      # gates this job's own exit code on a triggered alert (report-
      # only, per `evals trend alert`'s own docstring) -- this workflow
      # stays a data-collection run, not a pass/fail gate, matching the
      # report step above. continue-on-error also covers the one real
      # non-alert failure mode: the trend file genuinely absent (the
      # report step above failed before ever writing it) -- the same
      # "expected, not masked" posture the restore step above already
      # takes on a cache miss.
      - name: check judge-accuracy trend thresholds
        if: always()
        continue-on-error: true
        working-directory: evals
        run: |
          uv run evals trend alert --path judge-accuracy-trend.jsonl \
            --threshold judge_accuracy_kappa:below:0.2:warning \
            --threshold judge_panel_tie_rate:above:0.6:warning
      - name: save trend history for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: evals/judge-accuracy-trend.jsonl
          key: judge-accuracy-trend-${{ github.run_id }}
