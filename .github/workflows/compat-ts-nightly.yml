name: Compatibility (nightly TypeScript leg)

# RFC-1 §11's TypeScript leg (item 11 slice S13), under owner decision G15
# (2026-10-10) and the one-line note in docs/decisions/0003-go-python-split.md:
# TypeScript appears only as CI test tooling, in a CI container, nightly and
# non-blocking: no pull_request or push trigger, and not among main's required
# status checks.
# The job builds the gateway from the tree (the compat harness does that
# itself), installs .github/compat-ts/ (the official @anthropic-ai/sdk and
# @anthropic-ai/claude-code at pinned versions) and runs the two tests behind
# the `compat_ts` build tag: the SDK against the gateway's Anthropic routes,
# and `claude -p` -- Claude Code itself, the P0 client -- for one headless
# turn. Nothing under gateway/ or evals/ is TypeScript and no Node enters a
# release image.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: compat-ts-nightly
  cancel-in-progress: false

jobs:
  ts-leg:
    name: "@anthropic-ai/sdk and claude -p against a built gateway"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Digest-pinned node image from the ECR Public mirror of the Docker
    # library (Docker Hub's anonymous pull limit bit ci.yml on 2026-10-10).
    # The FULL bookworm image, not -slim: the first dispatched run (38112312628,
    # 2026-10-11) failed inside node:22-bookworm-slim with
    # `x509: certificate signed by unknown authority` from proxy.golang.org --
    # node bundles its own CA store (so npm ci and setup-go's download worked)
    # while Go reads the system one, which the slim image does not ship; the
    # full image carries ca-certificates and git. `docker buildx imagetools
    # inspect public.ecr.aws/docker/library/node:22-bookworm` resolved to this
    # index digest on 2026-10-11; the tag is named here because a trailing
    # comment on the image line is not read by anyone.
    container:
      image: public.ecr.aws/docker/library/node:22-bookworm@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          # No Go cache in a job that runs third-party npm code before the
          # cache's post-step would save it: nothing a compromised dependency
          # touches may be stored for another job.
          cache: false
      - name: npm ci (the pinned SDK and Claude Code, lockfile committed)
        working-directory: .github/compat-ts
        timeout-minutes: 10 # the ~240 MB platform binary is an integrity-checked optional dependency npm fetches
        run: |
          node --version
          npm --version
          # --ignore-scripts: no dependency's lifecycle script runs. Claude Code's
          # own postinstall (install.cjs) only links (or copies) the platform binary
          # npm has already fetched and verified, so it is run explicitly; without
          # it node_modules/.bin/claude is a stub that exits 1.
          npm ci --ignore-scripts
          node node_modules/@anthropic-ai/claude-code/install.cjs
          HOME="$(mktemp -d)" DISABLE_AUTOUPDATER=1 DISABLE_TELEMETRY=1 CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1 node_modules/.bin/claude --version
      - name: TypeScript leg (the harness builds and starts the gateway; node and claude -p run against it)
        working-directory: gateway/compat
        timeout-minutes: 15 # each claude -p turn times out on its own at 4 minutes; this bounds the gateway build too
        env:
          KELVRAN_COMPAT_TS_DIR: ${{ github.workspace }}/.github/compat-ts
          KELVRAN_COMPAT_ARTIFACT_DIR: ${{ github.workspace }}/compat-ts-artifacts
          # The gateway builds without cgo and the test build needs no VCS
          # stamp; both off keeps the in-container build deterministic.
          CGO_ENABLED: "0"
          GOFLAGS: -buildvcs=false
        # -timeout above the three 4-minute per-child bounds, so a fully red night
        # ends with the per-turn message rather than Go's own test-timeout panic.
        run: go test -tags compat_ts -timeout 14m -run '^TestTypeScriptLeg' -count=1 -v ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() # the gateway log and the route counts matter most on a red run
        with:
          name: compat-ts-artifacts
          path: compat-ts-artifacts/
          if-no-files-found: warn
          retention-days: 30
