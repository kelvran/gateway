[project]
name = "kelvran-evals"
version = "0.8.0"
description = "Kelvran evals — agent-evaluation system (statistically rigorous rollout scoring, CI/CD quality gates)"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "click>=8.1",
    "protobuf>=7.36.1",
    "anthropic>=1.3.0",
    "opentelemetry-sdk>=1.44.0",
    "openai>=3.8.0",
    "boto3>=1.35.0",
    # evals.judge.providers imports botocore.config.Config directly (not
    # just via boto3's own re-exports) -- declared explicitly rather than
    # relying solely on boto3's own transitive pin, per a fresh audit
    # sweep. Same floor as boto3 above: the two ship in lockstep from AWS.
    "botocore>=1.35.0",
    "google-cloud-storage>=2.18.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
evals = "evals.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live Docker daemon (skipped unless RUN_DOCKER_TESTS=1)",
    "llm_integration: requires a live Anthropic API key (skipped unless RUN_LIVE_LLM_TESTS=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# Generated protobuf Python code (evals/contracts/) is machine-written by
# protoc, never hand-edited, and not ruff-clean by construction (unlike
# Go's protoc-gen-go output, which already is) — per
# docs/rfcs/2026-09-03-api-gatewayevents-contract.md, excluded entirely
# rather than suppressing individual rules per generated file.
extend-exclude = ["evals/contracts"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle core correctness checks.
# I: import sorting — enforced instead of hand-maintained import order.
# UP: modern-Python idioms for the 3.12+ floor AGENTS.md commits to
#     (e.g. `list[str]` / `X | None` over `List[str]` / `Optional[X]`,
#     which this codebase already uses throughout `models.py`/`stats.py`).
# B: bugbear — catches real correctness hazards (mutable default
#     arguments, loop-variable closures) that plain pyflakes misses; this
#     matters here specifically because `EvalCase` is documented as
#     immutable-by-convention and `judge()`/`run_in_sandbox()` are
#     asyncio-orchestrated per AGENTS.md's Python conventions.
# S: ruff's native re-implementation of flake8-bandit (no separate
#    `bandit` dependency needed) — code-level security-pattern checks
#    distinct from pip-audit's known-CVE-only dependency scanning.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.isort]
known-first-party = ["evals"]

[tool.ruff.lint.per-file-ignores]
# The golden fixture string is a byte-for-byte capture of the real,
# already-long (unwrapped) rendered judge prompt from
# evals/judge/llm_judge.py's `_JUDGE_PROMPT_TEMPLATE` — reflowing it to
# satisfy E501 would silently break the exact-match assertion the whole
# test exists to make. A deliberate, narrow suppression on this one file,
# analogous to the hand-rolled-parser exemption pattern, not a blanket
# E501 disable.
"tests/test_llm_judge_prompt_golden.py" = ["E501"]
# Test-only false-positive classes, all confirmed by direct triage
# rather than blanket-disabled on assumption:
# S101 (assert) — pytest's own idiom for every assertion in the suite;
#   asserts are stripped under `python -O` in production code, never in
#   test files run directly by pytest.
# S603/S607 (subprocess call / partial executable path) — real calls to
#   `git`/`docker` in test code that exercises corpus_staleness.py's and
#   the sandbox integration test's own subprocess-calling behavior;
#   fixed, literal executable names, never external/attacker input.
# S311 (weak PRNG) — `random.Random(seed)` used for deterministic
#   Monte Carlo simulation of a statistical test's false-positive/power
#   rate (test_stats_properties.py), never cryptographic material.
# S105 (hardcoded password) — fires on `pass_response = "...VERDICT:
#   PASS..."`, a judge-verdict test fixture whose variable name merely
#   starts with "pass"; not a credential.
"tests/*" = ["S101", "S603", "S607", "S311", "S105"]

[tool.mypy]
# Incremental adoption, per mypy's own docs recommendation to wire into CI
# "as soon as possible" via a permissive global default plus an explicit
# per-module strict opt-in -- not a big-bang strict pass across the whole
# package. Closes the real AGENTS.md Conventions gap ("type hints on all
# public functions" was documented but never enforced by CI/lint).
#
# Real baseline, measured 2026-09-14 by actually running `uv run mypy
# evals/` (not guessed): 47 errors across 9 files (cli.py, tracing.py,
# rollout/scheduler.py, judge/providers.py, ingestion/decode.py,
# ingestion/mapping.py, ingestion/object_store.py, trend_alert.py, plus
# the generated contracts/ package) -- real gaps (missing type-arg dicts,
# union-attr access on SDK response types, str-vs-Literal mismatches),
# left unfixed here rather than suppressed, since fixing all of them is
# real, separately-scoped work, not a "small, honest set of fixes."
# ignore_errors below means those 9 files, and everything not listed in
# the override section, run through mypy but report nothing -- the
# permissive baseline this adoption starts from.
python_version = "3.12"
ignore_errors = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Modules verified 2026-09-14 to pass `mypy --strict` for real, with zero
# suppressions -- either already strict-clean (stats.py, most of judge/
# and rollout/cache.py) or made strict-clean by two small, honest fixes
# (models.py's and rollout/cache.py's `dict` -> `dict[str, Any]`, the
# exact "small, real, honest set of fixes" this adoption strategy calls
# for, not a `# type: ignore`). Re-verify this list against real mypy
# output before adding to it -- do not assume a new module is clean.
module = [
    "evals",
    "evals.models",
    "evals.stats",
    "evals.audit_corpus",
    "evals.auto_flag",
    "evals.corpus_staleness",
    "evals.field_swap_lint",
    "evals.results_store",
    "evals.judge",
    "evals.judge.cache",
    "evals.judge.deterministic",
    "evals.judge.llm_judge",
    "evals.rollout",
    "evals.rollout.cache",
    "evals.ingestion",
    "evals.webhook",
]
ignore_errors = false
strict = true

[tool.coverage.run]
source = ["evals"]
# Required by python-coverage-comment-action's own Setup docs so the
# paths recorded in `.coverage` are portable across the CI runner (and
# any other checkout), not tied to one machine's absolute path.
relative_files = true
# Generated protobuf code -- machine-written by protoc, never
# hand-edited. Mirrors this same file's own
# `[tool.ruff] extend-exclude = ["evals/contracts"]` treatment of the
# identical generated code.
omit = ["evals/contracts/*"]
