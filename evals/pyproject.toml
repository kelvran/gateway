[project]
name = "evals"
version = "0.1.0"
description = "Kelvran evals — agent-evaluation system (statistically rigorous rollout scoring, CI/CD quality gates)"
readme = "ARCHITECTURE.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "click>=8.1",
]

[project.scripts]
evals = "evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live Docker daemon (skipped unless RUN_DOCKER_TESTS=1)",
]
