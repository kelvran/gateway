# See ../README.md before applying this to a live cluster -- the
# resource sizing below is illustrative, not measured against real
# traffic. replicas: 2 assumes budget/identity are Redis-backed
# (config.yaml's budget.redis_addr/admin.redis_addr) -- see the
# "Multi-replica deployment" bullet under ../README.md's own "Real,
# disclosed limitations" section for what each knob buys you and what
# happens if you scale past 1 replica WITHOUT setting them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  # Closes CKV_K8S_21 ("the default namespace should not be used") for
  # real: Checkov's own kubernetes-framework scan reads this raw file
  # directly, never through `kustomize build` (same reason kubeconform
  # validates raw files too -- see kustomization.yaml's own
  # configMapGenerator comment) -- kustomization.yaml's own top-level
  # `namespace:` field is a real, additional kustomize-time override
  # that applies on top of this when actually deploying via `kubectl
  # apply -k`, not a substitute for stating it here.
  namespace: kelvran
  labels:
    app.kubernetes.io/name: kelvran-gateway
spec:
  # 2, not 1: no PVC is mounted here at all (this manifest's own
  # in-memory-only default, or Redis via config.yaml's budget.redis_addr/
  # admin.redis_addr/config_propagation.redis_addr — see
  # internal/budget/redisbudget, internal/identity/redisstore, and
  # internal/configpropagation's own doc comments), so there is no
  # per-replica-exclusive volume to force replicas: 1 the way an RWO PVC
  # would. If you instead add a PVC for a bbolt persist_path (still
  # single-process-only by design, per identity.Store/budget.Store's own
  # doc comments), drop this back to 1 and add `strategy: { type:
  # Recreate }` — an RWO volume can only ever be mounted by one Pod at a
  # time, and a rolling update would deadlock waiting for the old Pod to
  # release it.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kelvran-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kelvran-gateway
    spec:
      # See serviceaccount.yaml's own comment for why a dedicated
      # ServiceAccount exists at all (IRSA needs one to attach a trust
      # policy to) and why it's safe across every cluster type.
      serviceAccountName: kelvran-gateway
      # Closes a real Checkov finding (CKV_K8S_38, "Service Account
      # Tokens are only mounted where necessary"): the gateway process
      # itself never calls the Kubernetes API, so it has no use for its
      # own ServiceAccount's API token being mounted into the container.
      # Safe alongside IRSA specifically -- IRSA's own mutating webhook
      # injects AWS credentials (env vars + a separate projected token
      # volume) based on the ServiceAccount's annotations at admission
      # time, a distinct mechanism from this K8s-API-token automount.
      automountServiceAccountToken: false
      # Matches gateway/Dockerfile's own non-root USER 65532:65532
      # (distroless's "nonroot" numeric UID convention) -- restated here,
      # not just relied on from the image, so a cluster-wide Pod Security
      # Standard/admission policy sees an explicit, auditable declaration
      # rather than an implicit inherited value. seccompProfile closes a
      # real Checkov finding (CKV_K8S_31).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Pinned to the real, currently-published gateway/v0.12.0
          # release by digest (independently re-verified via `docker
          # buildx imagetools inspect`, not assumed) -- closes 2 real
          # Checkov findings (CKV_K8S_14 "Image Tag should be fixed",
          # CKV_K8S_43 "Image should use digest"). Re-pin this to
          # whatever the current release is before applying -- this
          # value goes stale the moment a newer version ships, same as
          # any other pinned dependency.
          image: ghcr.io/kelvran/gateway:v0.12.0@sha256:810357492928a1750b0317f9895ef7269999c14f464dd4039ed85ecff84144f4
          # Container-level securityContext, distinct from the pod-level
          # block above (Checkov's own CKV_K8S_30 checks for this
          # specifically) -- closes CKV_K8S_20 (no privilege escalation),
          # CKV_K8S_37/CKV_K8S_28 (drop every Linux capability, which
          # covers NET_RAW specifically too -- the gateway needs none of
          # them, it only ever makes outbound HTTPS calls and serves
          # HTTP), and CKV_K8S_22 (read-only root filesystem -- safe for
          # this manifest's own default, in-memory-only configuration,
          # per ../README.md's own disclosure that no PVC is mounted
          # here; adding budget/prompt/identity persist_path persistence
          # later needs its own writable volume mount despite this
          # setting, not a silent conflict with it).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                # Every configured deployment's own api_key_env value
                # (OPENAI_API_KEY, ANTHROPIC_API_KEY, AWS_ACCESS_KEY_ID,
                # etc.) must resolve from this Secret's keys -- see
                # ../README.md for why this is a plain placeholder Secret
                # here, not a live ExternalSecret.
                name: gateway-upstream-credentials
          volumeMounts:
            - name: config
              mountPath: /config.yaml
              subPath: config.yaml
              readOnly: true
          # Liveness: /healthz checks only local process state -- no
          # upstream provider call, no cache/Redis call, nothing shared
          # across replicas -- confirmed directly against
          # cmd/gateway/main.go's healthzHandler. A liveness probe
          # hitting an external dependency would cause simultaneous
          # restarts across every replica on a transient blip; this one
          # structurally can't, since it checks nothing external at all.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: the SAME /healthz endpoint is safe to reuse here
          # specifically because it has zero external dependencies --
          # the real anti-pattern this avoids is a readiness probe
          # checking a dependency shared identically across every
          # replica (a shared Redis, or the upstream LLM provider),
          # which would fail every instance's readiness in lockstep on a
          # shared-dependency blip, emptying the Service's own
          # EndpointSlice entirely -- worse than doing nothing. This
          # probe never can, since it checks nothing shared.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          # Illustrative starting point, not measured against real
          # traffic -- see ../README.md. The memory limit specifically
          # is load-bearing: cmd/gateway/main.go's automemlimit call
          # reads this cgroup limit at startup and sets GOMEMLIMIT to
          # 90% of it automatically -- omitting this limit entirely
          # would leave Go's GC unbounded (stdlib default), the opposite
          # of what that in-code mechanism exists to prevent.
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            # Generated by kustomization.yaml's configMapGenerator from a
            # local, gitignored config.yaml -- see ../README.md's Usage
            # section. config.yaml itself never holds a raw secret (only
            # SHA-256 key hashes), so a ConfigMap, not a Secret, is the
            # correct object for it.
            name: gateway-config
