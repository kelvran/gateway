# A dedicated ServiceAccount for the gateway Pod, rather than relying on
# the namespace's own "default" ServiceAccount -- required for IRSA
# (Kubernetes report's own documented, not-yet-live ESO decision) to
# have anything to attach a trust policy to at all, since IRSA's OIDC
# trust condition names an exact namespace/ServiceAccount pair.
#
# Both annotations below are safe to leave present together on any
# cluster type -- only the mechanism actually running in-cluster reads
# its own annotation; an EKS cluster's own IRSA webhook ignores
# iam.amazonaws.com/role entirely, and a self-managed cluster running
# kiam/kube2iam ignores eks.amazonaws.com/role-arn entirely. See
# ../README.md's "Which annotation for which cluster type" section.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kelvran-gateway
  # See ../deployment.yaml's own comment on this same field for why
  # it's stated directly here, not just via kustomization.yaml's
  # transform.
  namespace: kelvran
  labels:
    app.kubernetes.io/name: kelvran-gateway
  annotations:
    # EKS + IRSA: the role ARN from terraform/irsa-trust/'s own
    # role_arn output. Replace before applying to a real EKS cluster --
    # left as a placeholder here, matching deployment.yaml's own
    # "image: ...:latest # pin to a real digest/tag" placeholder
    # convention.
    eks.amazonaws.com/role-arn: "REPLACE_WITH_IRSA_ROLE_ARN"
    # Self-managed Kubernetes + kiam/kube2iam: the role ARN the
    # in-cluster metadata-proxy is configured to allow this annotation
    # to assume -- see ../README.md for kiam/kube2iam's own trust-policy
    # shape (assumed via the EC2 instance profile the proxy itself runs
    # under, a different trust principal than IRSA's OIDC provider).
    # Omit this annotation entirely on an EKS+IRSA cluster -- it is a
    # harmless no-op there, but there is no reason to carry a value with
    # nothing in-cluster to read it.
    iam.amazonaws.com/role: "REPLACE_WITH_KIAM_KUBE2IAM_ROLE_ARN"
