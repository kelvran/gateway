# ESO SecretStore targeting AWS Secrets Manager, authenticating via THIS
# workload's own IRSA-bound ServiceAccount (../../base/serviceaccount.yaml)
# rather than the ESO controller pod's own identity -- ESO's documented
# `auth.jwt.serviceAccountRef` mechanism, per External Secrets Operator's
# own "AWS Secrets Manager (IRSA)" auth docs. No static AWS access key
# anywhere in this manifest or the Secret it produces.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kelvran-gateway-aws-secrets-manager
  labels:
    app.kubernetes.io/name: kelvran-gateway
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # must match terraform/irsa-trust's own aws_region
      auth:
        jwt:
          serviceAccountRef:
            name: kelvran-gateway
