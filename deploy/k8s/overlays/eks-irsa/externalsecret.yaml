# Produces a real Secret under the exact name
# (gateway-upstream-credentials) ../../base/deployment.yaml's own
# envFrom.secretRef already references -- replacing
# ../../base/secret-placeholder.yaml's empty stub for real EKS
# deployments (this overlay's own kustomization.yaml deletes that stub).
#
# The four keys below match gateway/config.example.yaml's own
# api_key_env/access_key_id_env/secret_access_key_env values verbatim --
# add or remove entries here to match whichever providers your own
# config.yaml actually configures, never more than that.
#
# remoteRef.key values are illustrative placeholders -- replace with the
# real Secrets Manager secret names/ARNs you created (and scoped
# terraform/irsa-trust's own secrets_manager_secret_arns variable to)
# before applying this to a real cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gateway-upstream-credentials
  labels:
    app.kubernetes.io/name: kelvran-gateway
spec:
  secretStoreRef:
    name: kelvran-gateway-aws-secrets-manager
    kind: SecretStore
  target:
    name: gateway-upstream-credentials
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: kelvran/gateway/openai-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: kelvran/gateway/anthropic-api-key
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: kelvran/gateway/gemini-api-key
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: kelvran/gateway/aws-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kelvran/gateway/aws-secret-access-key
